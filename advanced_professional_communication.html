<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Advanced Professional English — Notes &amp; Practice</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js" onload="renderMath(document.body)"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%230B2149'/%3E%3Cpath d='M31 10v28H15z' fill='%23fff'/%3E%3Cpath d='M35 18v20h13z' fill='%23FFB100'/%3E%3Cpath d='M14 40h36l-6 7H20z' fill='%23fff'/%3E%3Cpath d='M10 53q5.5-6 11 0t11 0 11 0 11 0' stroke='%23FFB100' stroke-width='3.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Roboto+Slab:wght@500&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand-blue:#005EA6;
    --brand-dark:#003B6F;
    --bg-light:#F8F9FA;
    --border-color:#E0E0E0;
    --text-main:#333333;
    --success-color:#2E7D32;
    --error-color:#C62828;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Roboto',sans-serif;-webkit-font-smoothing:antialiased;}
  body{background:#fff;color:var(--text-main);display:flex;flex-direction:column;height:100vh;overflow:hidden;}

  header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-color);height:67px;padding:0 16px;background:#fff;z-index:110;flex-shrink:0;}
  .header-left{display:flex;align-items:center;height:100%;min-width:0;flex:1;}
  .logo-container{padding:0;height:100%;display:flex;align-items:center;border-right:none;flex-shrink:0;}
  .logo-container .brand-logo{height:34px;width:auto;display:block;}
  .logo-container span{font-weight:700;font-size:15px;letter-spacing:.3px;font-family:'Roboto Slab',serif;color:var(--brand-blue);display:none;}
  .subject-title{margin-left:28px;font-weight:700;font-size:18px;color:#0B2149;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .header-right{padding-right:0;font-size:13px;color:#666;}

  .navigation-bar{background:var(--bg-light);border-bottom:1px solid var(--border-color);padding:12px 40px;display:flex;align-items:center;overflow-x:auto;gap:8px;min-height:52px;flex-shrink:0;}
  .nav-bubble{position:relative;min-width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--brand-blue);color:var(--brand-blue);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;user-select:none;transition:all .15s ease;flex-shrink:0;}
  .nav-bubble.active{background:var(--brand-blue);color:#fff;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--brand-blue);}
  .nav-bubble.answered{background:var(--brand-blue);color:#fff;}

  main{flex:1;display:flex;flex-direction:column;padding:30px 15% 40px 15%;overflow-y:auto;background:#fff;}
  .question-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .question-number{font-size:17px;font-weight:700;color:#111;}
  .marks-badge{background:#EAF2FA;color:var(--brand-blue);font-size:12px;font-weight:700;padding:3px 10px;border-radius:12px;letter-spacing:.3px;}
  .question-text{font-size:17px;line-height:1.6;margin-bottom:6px;color:#222;font-weight:500;}
  .question-hint{font-size:13px;color:#777;margin-bottom:20px;}

  textarea{width:100%;min-height:160px;font-size:15px;line-height:1.6;padding:14px 16px;border:1px solid var(--border-color);border-radius:8px;font-family:'Roboto',sans-serif;color:var(--text-main);resize:vertical;}
  textarea:focus{outline:2px solid var(--brand-blue);outline-offset:1px;}

  .actions-row{display:flex;align-items:center;gap:12px;margin-top:16px;}
  .btn-primary{background:var(--brand-blue);color:#fff;border:none;padding:12px 28px;font-size:14px;font-weight:500;border-radius:6px;cursor:pointer;}
  .btn-primary:hover{background:var(--brand-dark);}
  .btn-secondary{background:#fff;border:1px solid var(--border-color);color:#444;padding:11px 20px;font-size:14px;font-weight:500;border-radius:6px;cursor:pointer;}
  .btn-secondary:hover{border-color:#999;}

  .result-box{margin-top:24px;border:1px solid var(--border-color);border-radius:8px;display:flex;flex-direction:column;max-height:340px;display:none;}
  .result-score{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--bg-light);border-bottom:1px solid var(--border-color);border-radius:8px 8px 0 0;flex-shrink:0;}
  .result-score .score-num{font-size:18px;font-weight:700;color:var(--brand-dark);}
  #resultRows{overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .result-row{display:flex;align-items:flex-start;gap:14px;padding:12px 18px;border-bottom:1px dashed var(--border-color);}
  .result-row:last-child{border-bottom:none;}
  .result-icon{min-width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;margin-top:1px;}
  .result-icon.hit{background:var(--success-color);}
  .result-icon.miss{background:var(--error-color);}
  .result-text .expected{font-size:14.5px;color:#222;font-weight:500;}
  .result-text .matched{font-size:12.5px;color:#888;margin-top:2px;}

  footer{border-top:1px solid var(--border-color);background:#fff;display:flex;align-items:center;justify-content:space-between;padding:14px 40px;flex-shrink:0;}
  .nav-btn{background:#fff;border:1px solid var(--border-color);color:#333;padding:10px 20px;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;}
  .nav-btn:disabled{opacity:.4;cursor:not-allowed;}
  .total-pill{font-size:13.5px;color:#555;}
  .total-pill b{color:var(--brand-dark);}
  .switch-mode-btn{background:none;border:1px solid var(--border-color);color:#555;font-size:12.5px;padding:6px 12px;border-radius:6px;cursor:pointer;}
  .switch-mode-btn:hover{border-color:#999;}

  /* ===== Start screen (Khan Academy style) ===== */
  .start-screen{position:fixed;inset:0;background:#F7F8FA;z-index:200;overflow-y:auto;}
  .ks-topbar{background:#fff;border-bottom:1px solid var(--border-color);height:56px;display:flex;align-items:center;padding:0 28px;gap:10px;position:sticky;top:0;z-index:2;}
  .ks-logo{width:30px;height:30px;border-radius:8px;background:#1865F2;color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;letter-spacing:.3px;}
  .ks-brand{font-weight:700;font-size:16px;color:#0B2149;}
  .ks-hero{background:linear-gradient(135deg,#0B2149 0%,#14366F 60%,#1B4B9B 100%);color:#fff;padding:44px 28px 92px;text-align:center;}
  .ks-hero h1{font-family:'Roboto Slab',serif;font-weight:500;font-size:34px;line-height:1.2;margin-bottom:10px;}
  .ks-hero p{font-size:16px;color:#C9D6EE;max-width:520px;margin:0 auto;}
  .ks-body{max-width:960px;margin:-56px auto 0;padding:0 24px 56px;}
  .ks-section{background:#fff;border:1px solid var(--border-color);border-radius:14px;padding:24px;margin-bottom:20px;box-shadow:0 1px 3px rgba(11,33,73,.06);}
  .start-label{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;color:#0B2149;margin:0 0 18px;}
  .start-label .step{width:26px;height:26px;border-radius:50%;background:#0B2149;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .start-label .hint{margin-left:auto;font-size:13px;font-weight:400;color:#6B7280;}

  .module-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;}
  .mod-btn{--c:#1865F2;position:relative;background:#fff;border:2px solid #DDE1E6;border-radius:12px;padding:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;overflow:hidden;transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease;}
  .mod-btn:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:0 6px 16px rgba(11,33,73,.10);}
  .mod-btn.selected{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent);}
  .mod-banner{height:84px;background:var(--c);display:flex;align-items:center;padding:0 18px;position:relative;overflow:hidden;}
  .mod-banner::after{content:"";position:absolute;right:-24px;top:-34px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14);}
  .mod-banner::before{content:"";position:absolute;right:38px;bottom:-40px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.10);}
  .mod-num{font-family:'Roboto Slab',serif;font-size:40px;font-weight:500;color:#fff;line-height:1;position:relative;z-index:1;}
  .mod-num small{display:block;font-family:'Roboto',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:.85;margin-bottom:4px;}
  .mod-check{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:#fff;color:var(--c);display:none;align-items:center;justify-content:center;z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.2);}
  .mod-btn.selected .mod-check{display:flex;}
  .mod-info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .mod-btn .mod-name{font-size:16px;font-weight:700;color:#0B2149;line-height:1.3;}
  .mod-btn .mod-desc{font-size:13px;color:#5F6B7A;line-height:1.45;}
  .mod-count{margin-top:auto;padding-top:8px;font-size:12px;font-weight:700;color:var(--c);}
  .mod-btn[data-mod="m1"]{--c:#1865F2;}
  .mod-btn[data-mod="m2"]{--c:#0D923F;}
  .mod-btn[data-mod="m3"]{--c:#9059FF;}
  .mod-btn[data-mod="m4"]{--c:#E0641B;}
  .mod-btn[data-mod="m5"]{--c:#D6336C;}

  .mode-buttons{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .mode-btn{background:#fff;border:2px solid #DDE1E6;border-radius:12px;padding:20px;cursor:pointer;display:flex;align-items:flex-start;gap:16px;text-align:left;transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease;}
  .mode-btn:hover{border-color:#1865F2;transform:translateY(-2px);box-shadow:0 6px 16px rgba(24,101,242,.14);}
  .mode-icon{width:48px;height:48px;border-radius:12px;background:#E8F0FE;color:#1865F2;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .mode-text{display:flex;flex-direction:column;gap:4px;flex:1;}
  .mode-title{font-size:17px;font-weight:700;color:#0B2149;}
  .mode-sub{font-size:13px;color:#5F6B7A;line-height:1.45;}
  .mode-go{margin-top:8px;font-size:13px;font-weight:700;color:#1865F2;}

  .mcq-options{display:none;flex-direction:column;gap:10px;}
  .mcq-option{border:1px solid var(--border-color);border-radius:8px;padding:12px 16px;font-size:14.5px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .15s ease;}
  .mcq-option:hover{border-color:var(--brand-blue);}
  .mcq-option.selected{border-color:var(--brand-blue);background:#EAF2FA;}
  .mcq-option.disabled{cursor:default;}
  .mcq-option .opt-letter{min-width:24px;height:24px;border-radius:50%;border:1.5px solid #999;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#666;flex-shrink:0;}
  .mcq-option.selected .opt-letter{border-color:var(--brand-blue);background:var(--brand-blue);color:#fff;}
  .mcq-option.correct{border-color:var(--success-color);background:#EAF7EA;}
  .mcq-option.correct .opt-letter{background:var(--success-color);border-color:var(--success-color);color:#fff;}
  .mcq-option.incorrect{border-color:var(--error-color);background:#FDEAEA;}
  .mcq-option.incorrect .opt-letter{background:var(--error-color);border-color:var(--error-color);color:#fff;}
  .mcq-feedback{margin-top:16px;padding:12px 16px;border-radius:8px;font-size:14px;font-weight:500;display:none;}
  .mcq-feedback.hit{background:#EAF7EA;color:var(--success-color);}
  .mcq-feedback.miss{background:#FDEAEA;color:var(--error-color);}


  .module-tabs{display:flex;gap:6px;margin-left:auto;margin-right:16px;}
  .module-tab{background:#fff;border:1.5px solid var(--border-color);color:var(--brand-dark);font-size:13px;font-weight:700;padding:7px 16px;border-radius:20px;cursor:pointer;transition:all .15s ease;}
  .module-tab:hover{border-color:var(--brand-blue);}
  .module-tab.active{background:var(--brand-blue);border-color:var(--brand-blue);color:#fff;}
  .header-actions{display:flex;align-items:center;gap:8px;padding-right:20px;}
  .mode-chip{font-size:12px;font-weight:700;color:var(--brand-blue);background:#EAF2FA;padding:4px 10px;border-radius:12px;}

  @media (max-width: 700px){
    .ks-hero{padding:32px 18px 80px;}
    .ks-hero h1{font-size:25px;}
    .ks-body{padding:0 14px 40px;}
    .ks-section{padding:18px 14px;}
    .module-picker{grid-template-columns:1fr;}
    .mode-buttons{grid-template-columns:1fr;}
    header{height:auto;flex-wrap:wrap;padding:10px 14px;}
    .header-left{flex-wrap:wrap;}
    .logo-container{padding:0 12px 0 0;border-right:none;height:auto;}
    .subject-title{padding-left:0;font-size:14px;}
    .header-right{display:none;}
    .module-tabs{margin:8px 0 0 0;width:100%;}
    .module-tab{flex:1;}
    .header-actions{padding-right:0;margin-top:8px;width:100%;justify-content:space-between;}
    .navigation-bar{padding:10px 14px;}
    main{padding:20px 16px 30px 16px;}
    .question-text{font-size:15.5px;}
    textarea{min-height:130px;font-size:14px;}
    .actions-row{flex-wrap:wrap;}
    .btn-primary,.btn-secondary{flex:1;text-align:center;padding:12px 14px;}
    .result-box{max-height:none;}
    #resultRows{max-height:45vh;}
    footer{padding:12px 16px;flex-wrap:wrap;gap:10px;justify-content:center;}
    .total-pill{order:3;width:100%;text-align:center;}
    .nav-btn{flex:1;padding:10px 12px;font-size:13.5px;}
  }

  /* ===== Mobile / responsive fixes ===== */
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;font-family:inherit;}
  .question-text,.mcq-option span,.result-text{overflow-wrap:anywhere;}
  .module-tab,.nav-btn,.switch-mode-btn,.mode-chip{white-space:nowrap;}
  .module-tabs{flex-wrap:nowrap;}

  @media (max-width:1024px){
    main{padding:26px 6% 32px;}
    .navigation-bar{padding:12px 24px;}
    footer{padding-left:24px;padding-right:24px;}
  }

  /* Phones: let the PAGE scroll (no fixed-height shell), sticky footer */
  @media (max-width:700px){
    html,body{height:auto;min-height:100%;}
    body{display:block;overflow:visible;overscroll-behavior-y:none;}
    #appScreen{flex:none !important;min-height:100vh;min-height:100dvh;}

    .ks-topbar{padding:0 max(16px,env(safe-area-inset-left));}

    header{display:block;height:auto;flex-wrap:nowrap;padding:calc(8px + env(safe-area-inset-top)) 12px 10px;}
    .header-left{display:flex;flex-wrap:nowrap;align-items:center;height:auto;width:100%;min-width:0;}
    .logo-container{height:auto;padding:0 10px 0 0;border-right:none;flex-shrink:0;}
    .logo-container .brand-logo{height:28px;}
    .subject-title{padding-left:0;font-size:13.5px;line-height:1.3;min-width:0;flex:1;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .header-right{display:none;}

    .module-tabs{display:flex;gap:6px;width:100%;margin:10px 0 0;padding:0 0 2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
    .module-tabs::-webkit-scrollbar{display:none;}
    .module-tab{flex:0 0 auto;padding:8px 14px;font-size:13px;line-height:1.2;}

    .header-actions{display:flex;align-items:center;gap:6px;width:100%;margin:10px 0 0;padding:0;justify-content:flex-start;}
    .mode-chip{margin-right:auto;}
    .switch-mode-btn{padding:8px 12px;font-size:12.5px;min-height:36px;}

    .navigation-bar{flex:none;padding:10px 14px;min-height:54px;gap:8px;-webkit-overflow-scrolling:touch;}
    .nav-bubble{min-width:32px;height:32px;}

    main{flex:none;overflow:visible;padding:18px 14px 24px;}
    .question-meta{gap:10px;}
    .question-number{font-size:15px;}
    .question-text{font-size:16px;}
    textarea{font-size:16px;min-height:140px;padding:12px;}   /* 16px prevents iOS zoom */
    .mcq-option{padding:14px;font-size:15px;min-height:48px;}
    .actions-row{gap:8px;flex-wrap:nowrap;}
    .btn-primary,.btn-secondary{flex:1;min-height:46px;font-size:15px;padding:12px 10px;}
    .result-box{max-height:none;}
    #resultRows{max-height:none;overflow:visible;}
    .result-row{padding:12px;gap:10px;}
    .result-score{padding:12px;}

    footer{position:sticky;bottom:0;z-index:50;flex-wrap:nowrap;gap:8px;justify-content:space-between;
      padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -2px 8px rgba(0,0,0,.05);}
    .total-pill{order:0;width:auto;flex:1;text-align:center;font-size:12.5px;white-space:nowrap;}
    .nav-btn{flex:0 0 auto;min-height:44px;padding:10px 14px;font-size:14px;}

    .mode-btn{padding:16px;gap:12px;}
    .mod-banner{height:72px;}
    .start-label{font-size:16px;flex-wrap:wrap;}
  }

  @media (max-width:380px){
    .nav-btn{padding:10px 10px;font-size:13px;}
    .ks-hero h1{font-size:22px;}
  }
  @media (hover:none){
    .mod-btn:hover,.mode-btn:hover{transform:none;}
  }

/* ===== Notes / reading view (Khan-style) ===== */
main.read-main{padding:28px 20px 70px;background:#F7F8FA;}
.read-wrap{max-width:780px;margin:0 auto;--c:#1865F2;}
.read-hero{background:var(--c);color:#fff;border-radius:14px;padding:24px 26px;margin-bottom:18px;position:relative;overflow:hidden;}
.read-hero::after{content:"";position:absolute;right:-30px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.14);}
.read-hero small{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:.9;}
.read-hero h1{font-family:'Roboto Slab',serif;font-weight:500;font-size:28px;line-height:1.2;margin-top:4px;position:relative;}
.read-card{background:#fff;border:1px solid var(--border-color);border-radius:14px;padding:24px 26px;margin-bottom:18px;line-height:1.7;font-size:16px;color:#222;}
.read-card h2{font-family:'Roboto Slab',serif;font-weight:500;font-size:21px;color:#0B2149;margin:26px 0 8px;padding-top:6px;border-top:1px solid #EEF0F3;}
.read-card h2:first-child,.read-card .obj+h2{margin-top:18px;}
.read-card h3{font-size:16px;color:#0B2149;margin:14px 0 4px;}
.read-card p{margin:8px 0;}
.read-card ul,.read-card ol{margin:8px 0 8px 22px;}
.read-card li{margin:4px 0;}
.read-card b{color:#0B2149;background:color-mix(in srgb,var(--c) 13%,transparent);padding:0 3px;border-radius:3px;font-weight:700;}
.obj{background:#F1F4F9;border-left:5px solid var(--c);border-radius:8px;padding:12px 18px;font-size:15px;}
.obj strong{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--c);margin-bottom:4px;}
.obj ul{margin:4px 0 0 18px;}
.note{border:1px solid #D5DAE1;border-radius:10px;padding:12px 16px;margin:14px 0;font-size:15px;background:#FAFBFC;}
.note strong.t{display:block;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:#555;margin-bottom:3px;}
.note.new{border-color:var(--c);}
.note.new strong.t{color:var(--c);}
.say{border-left:4px solid #0B2149;background:#fff;padding:8px 14px;margin:10px 0;font-style:italic;font-size:15px;color:#333;}
.kwt{width:100%;border-collapse:collapse;margin:12px 0;font-size:14.5px;line-height:1.5;}
.kwt th{background:#0B2149;color:#fff;text-align:left;padding:8px 12px;font-size:12.5px;letter-spacing:.5px;text-transform:uppercase;}
.kwt td{border-bottom:1px solid #E5E8EC;padding:9px 12px;vertical-align:top;}
.kwt td:first-child{font-weight:700;white-space:nowrap;color:#0B2149;}
.kwt-wrap{overflow-x:auto;}
.tag-new{display:inline-block;background:#111;color:#fff;font-size:10.5px;letter-spacing:.8px;font-weight:700;padding:2px 8px;border-radius:10px;vertical-align:middle;margin-left:8px;font-family:Roboto,sans-serif;}
figure.dg{margin:20px 0;border:1px solid #111;border-radius:8px;padding:18px 24px 18px;background:#fff;overflow:hidden;}
figure.dg svg{width:100%;height:auto;display:block;padding:10px 6px;box-sizing:border-box;clear:both;}
figure.dg figcaption{font-size:13px;color:#444;line-height:1.6;margin-top:14px;border-top:1px solid #ccc;padding-top:12px;}
.dg-btn{float:right;margin:0 0 14px 12px;background:#fff;border:1px solid #111;color:#111;font-size:12px;font-weight:700;padding:4px 10px;border-radius:5px;cursor:pointer;}

/* ===== Probability matrix ===== */

.pmx-rl{grid-row:2;grid-column:1;display:grid;grid-template-rows:repeat(2,40px);align-items:center;font-size:15px;font-weight:700;color:#0B2149;text-align:right;}

.pmx-m::before{left:0;border-right:0;}
.pmx-m::after{right:0;border-left:0;}
.pmx:not(.lab) .pmx-grid{grid-template-columns:auto;}

const PPT_NOTE=`<h2>Designing Slidedecks <span class="tag-new">NEW</span></h2>
<p>A slide deck is not a document projected on a wall. It is a <b>visual aid for a spoken story</b>: the slides carry the headline and the picture, and <b>you</b> carry the explanation. In an exam you may be asked to <b>design a presentation on paper</b> in a fixed time, usually 10 slides. Use only <b>boxes, lines, arrows, circles and stick figures</b>, with <b>one idea and one sketch per slide</b>. The skill being tested is not artistic ability; it is whether you can <b>plan a flow</b> (storyboarding), keep each slide <b>light</b> (reduced cognitive load) and make it <b>look clear</b> (visual appeal).</p>
<p>Our sample topic is <b>"The Importance of Mindful Messaging and Posting in the 21st Century"</b>, built around the <b>Grandma Test</b>: do not post anything your grandmother would not approve of.</p>
<figure class="dg"><button class="dg-btn" onclick="this.parentNode.classList.toggle('blank');this.textContent=this.parentNode.classList.contains('blank')?'Show labels':'Hide labels (test yourself)'">Hide labels (test yourself)</button>${pptSvg()}<figcaption><b>Draw it yourself:</b> fold or ruler-divide your page into <b>2 rows of 5 boxes</b>, number them 1 to 10, write a heading of 4 words or fewer in each, then add one simple sketch (30 seconds each). Row 1 sets up the topic; row 2 is data, story and action.</figcaption></figure>
<h3 class="sec">The 10 slides, one by one</h3>
<p>Each entry below gives the <b>job of the slide</b> and an <b>example for the sample topic</b>. Treat the examples as a starting point: replace them with your own content and add more detail as you practise.</p>
<p><b>Slide 1: Title.</b> Introduces the topic and the speaker so the audience knows what they are about to hear. Keep it to the topic, your name and one small icon. <i>Example:</i> "Think Before You Post" with a stick figure holding a phone, and your name underneath.</p>
<p><b>Slide 2: Hook.</b> Wins the audience's attention in the first 30 seconds with a question, a surprising fact or a challenge, before any background. <i>Example:</i> "Would your grandmother be proud of your last post?" with a stick figure of a grandmother looking at a phone.</p>
<p><b>Slide 3: Problem.</b> Explains why the topic matters <b>to this audience</b>, which is your audience analysis in action. Name who is affected and what is at risk. <i>Example:</i> college students and job seekers whose old posts can be seen by recruiters, with a sketch of a recruiter holding a magnifying glass over a profile.</p>
<p><b>Slide 4: Data.</b> Gives one piece of evidence in the simplest chart that works (a bar, a pie or a line). Do not crowd it: one chart, one message, a labelled axis. <i>Example:</i> a bar chart from a class survey, "How many of us have posted something we later regretted?" (use your own survey numbers if you collect them).</p>
<p><b>Slide 5: Insight.</b> Answers the "so what?" of the data in a single sentence, so the audience does not have to guess. <i>Example:</i> "Regret is common, and posts last longer than feelings." Draw an arrow from the chart to this sentence.</p>
<p><b>Slide 6: Story.</b> Makes the point human with a short real-life case. People remember stories far better than statistics. <i>Example:</i> in 2013 a communications executive posted a joke tweet before a long flight; by the time she landed it had gone viral and she had lost her job. Sketch a plane, a phone and a falling arrow.</p>
<p><b>Slide 7: Framework.</b> Gives the audience a tool they can use after the talk, preferably as an acronym. <i>Example:</i> <b>THINK</b>: is it <b>T</b>rue, <b>H</b>elpful, <b>I</b>nspiring, <b>N</b>ecessary, <b>K</b>ind? Draw five boxes, one per letter.</p>
<p><b>Slide 8: Do / Don't.</b> Turns the framework into concrete behaviour with two columns. Keep each line under 6 words. <i>Example:</i> Do: pause, re-read, ask "would Grandma approve?" Don't: post when angry, share unverified news.</p>
<p><b>Slide 9: Action.</b> Tells the audience exactly what to do next, in no more than 3 checklist steps with tick-boxes. <i>Example:</i> (1) Audit your public profiles tonight. (2) Delete one post you would not defend. (3) Use THINK before every post this week.</p>
<p><b>Slide 10: Close / Q&amp;A.</b> Repeats the key message one last time and opens for questions, because the audience remembers the end of a talk. <i>Example:</i> "Pause. Then post." with a large question mark.</p>
<h3 class="sec">Putting it together: a second example</h3>
<p>The same ten-slide skeleton fits any topic. Here is a compact storyboard for <b>"Why Every Engineering Student Needs a Portfolio"</b>, to show how the structure carries over.</p>
<div class="kwt-wrap"><table class="kwt"><tr><th>Slide</th><th>Heading (4 words or fewer)</th><th>Sketch idea</th></tr>
<tr><td>1. Title</td><td>Show, Don't Tell</td><td>Laptop with a folder icon</td></tr>
<tr><td>2. Hook</td><td>Can You Prove It?</td><td>Question mark above a resume</td></tr>
<tr><td>3. Problem</td><td>Resumes Look Alike</td><td>A stack of identical pages</td></tr>
<tr><td>4. Data</td><td>Resume vs Portfolio</td><td>Bar chart, two bars</td></tr>
<tr><td>5. Insight</td><td>Proof Beats Claims</td><td>Arrow from chart to a tick</td></tr>
<tr><td>6. Story</td><td>One Project, One Interview</td><td>Student pointing to a screen</td></tr>
<tr><td>7. Framework</td><td>Build, Document, Share</td><td>Three boxes with arrows</td></tr>
<tr><td>8. Do / Don't</td><td>Quality Over Quantity</td><td>Two columns, tick and cross</td></tr>
<tr><td>9. Action</td><td>Start This Week</td><td>Three tick-box lines</td></tr>
<tr><td>10. Close</td><td>Your Work, Visible</td><td>Question mark, "Q&amp;A"</td></tr></table></div>
<h3 class="sec">A fully solved example: AI in education, boon or curse?</h3>
<p>Here is a complete answer to an exam-style prompt: <b>"Design a 10-slide presentation on Artificial Intelligence: challenges, threats, boon or curse, and education."</b> The audience is <b>engineering students and faculty</b>. Before sketching anything, decide your <b>position</b>, because a deck with no position is only a list of facts. The position used here is balanced and defensible: <b>AI is neither boon nor curse by itself; it amplifies how we use it.</b> It rewards the learner who thinks first and harms the learner who skips thinking. The ten slides below build that argument in the same order as the posting example: set up (1 to 3), evidence and meaning (4 and 5), story (6), tool (7), judgement (8), action (9) and close (10).</p>
<figure class="dg"><button class="dg-btn" onclick="this.parentNode.classList.toggle('blank');this.textContent=this.parentNode.classList.contains('blank')?'Show labels':'Hide labels (test yourself)'">Hide labels (test yourself)</button>${pptSvgAI()}<figcaption><b>Draw it yourself:</b> the same <b>2 rows of 5 boxes</b>. Row 1 sets up the topic (title, hook, problem, data, insight); row 2 turns it into a story, a tool, a judgement, an action and a close. Keep every heading to <b>4 words or fewer</b>.</figcaption></figure>
<p><b>Slide 1: Title.</b> <i>Heading:</i> "Boon or Curse?" with the subtitle "AI in Education" and your name. <i>Sketch:</i> a simple robot head (a square, two circles for eyes, a line for a mouth). <i>You say:</i> "Today I will argue that AI is neither a boon nor a curse. It depends on how we use it."</p>
<p><b>Slide 2: Hook.</b> <i>Heading:</i> "Can You Check It?" <i>Sketch:</i> a speech bubble reading "AI answered in 3 seconds. Right?" <i>You say:</i> "An AI tool just wrote you a confident answer in three seconds. How many of us would know if it were wrong?" The hook is a <b>challenge to the audience</b>, so they are thinking before you give any background.</p>
<p><b>Slide 3: Problem.</b> <i>Heading:</i> "Why It Matters" <i>Sketch:</i> a box labelled AI with arrows to three circles: Marks, Skills, Jobs. <i>What it shows:</i> the <b>challenges</b> that touch this audience directly. AI can now draft essays, solve problems and write code in seconds, so it changes <b>how we are assessed</b>, <b>which skills are worth building</b> and <b>what employers expect</b>. Other challenges to name aloud: <b>wrong answers delivered confidently</b> (often called hallucinations), <b>bias</b> inherited from training data, <b>privacy</b> when confidential material is pasted into public tools, and unequal access to good tools. <i>You say:</i> "This is not a distant debate. It decides how you are marked and what you can do."</p>
<p><b>Slide 4: Data.</b> <i>Heading:</i> "How We Use AI" <i>Sketch:</i> one bar chart with three bars: Notes, Code, Essays. Use <b>your own evidence</b>: a quick show of hands or a short class survey on what students actually use AI for. One chart, one message, labelled axes. <i>You say:</i> "I asked our class how they use AI. Most of us use it for help, and a few use it to replace the work."</p>
<p><b>Slide 5: Insight.</b> <i>Heading:</i> "Tool, Not Substitute" <i>Sketch:</i> an arrow from the chart to the sentence "Think first, then prompt." <i>What it shows:</i> the <b>so what?</b> of the data and your <b>thesis</b> in one line: "AI amplifies the learner: it helps those who think first and harms those who skip thinking." This is also where you cover the <b>boon-or-curse</b> answer without sitting on the fence: the outcome depends on use.</p>
<p><b>Slide 6: Story.</b> <i>Heading:</i> "Fake Citations" <i>Sketch:</i> a stick figure beside a box reading "Made-up cases in court". <i>What it shows:</i> a real case that makes the threat human. In 2023, two New York lawyers filed a court brief citing legal cases that ChatGPT had invented. The judge fined them, and the incident became a worldwide warning to check AI output. <i>You say:</i> "They trusted a confident answer and never checked the source. The tool did not lose their case. Skipping the check did."</p>
<p><b>Slide 7: Framework.</b> <i>Heading:</i> "CITE Before Using" <i>Sketch:</i> four boxes, one per letter. <b>C</b>heck every fact against a named source. <b>I</b>dentify where AI helped, as your college allows. <b>T</b>hink first: draft your own idea, then prompt. <b>E</b>valuate the answer for bias and gaps. <i>You say:</i> "Four letters, and you can use them tonight." The framework connects back to <b>documentation and citation</b>: a claim is only as good as its source.</p>
<p><b>Slide 8: Boon vs Curse.</b> <i>Heading:</i> "Boon vs Curse" <i>Sketch:</i> two columns with a vertical line between them. <b>Boon:</b> a patient personal tutor, instant feedback, accessibility (captions, text to speech) and language support such as Tamil explanations. <b>Curse:</b> copied work, confident wrong answers, hidden bias, over-dependence and privacy leaks. Keep each line <b>under 6 words</b>. <i>You say:</i> "The same tool sits on both sides. What decides the side is the user."</p>
<p><b>Slide 9: Action.</b> <i>Heading:</i> "Your Action" <i>Sketch:</i> three tick-box lines. (1) Write your own outline before you prompt. (2) Fact-check two AI claims with named sources. (3) Note where AI helped in every assignment. <i>You say:</i> "Do these three things this week and you will already use AI better than most."</p>
<p><b>Slide 10: Close / Q&amp;A.</b> <i>Heading:</i> "Think. Then Prompt." <i>Sketch:</i> a large question mark. <i>You say:</i> "AI is a boon when we think first and a curse when we stop thinking. Thank you. Questions?" Ending on a <b>memorable line</b> that repeats your thesis gives the audience the one sentence they will remember.</p>
<div class="kwt-wrap"><table class="kwt"><tr><th>Where the deck earns marks</th><th>How this deck does it</th></tr>
<tr><td><b>Audience analysis</b></td><td>Slide 3 names marks, skills and jobs: what <b>this</b> audience cares about.</td></tr>
<tr><td><b>Storyboarding</b></td><td>Setup, evidence, story, tool, judgement, action, close: a clear beginning, middle and end.</td></tr>
<tr><td><b>DISA</b> (Data, Insight, Story, Action)</td><td>Slides 4, 5, 6 and 9 follow the sequence exactly.</td></tr>
<tr><td><b>Ethos, pathos, logos</b></td><td>Logos: the data and the framework. Pathos: the fake-citations story. Ethos: named, checkable sources.</td></tr>
<tr><td><b>Reduced cognitive overload</b></td><td>One idea and one sketch per slide, headings of 4 words or fewer, lines under 6 words.</td></tr></table></div>
<div class="say">Marking tips: <b>one idea per slide</b>, <b>storyboard</b> in order, <b>visual appeal</b> through simple sketches, and <b>reduced cognitive load</b> through under 6 words per line.</div>
<div class="why"><b class="t">Use this page to practise</b>Choose any topic from this course, hide the labels in the diagram, and write the ten headings from memory. Then add your own <b>Slide N: info</b> notes, in the same format as above, so your storyboard grows into a full talk. Check each slide against one question: <b>"Can the audience take this in within five seconds?"</b></div>

m1:{t:'Techniques for Interpersonal Skills',h:`
<div class="obj"><strong>What you will learn</strong><ul><li>Name the 4 decision frameworks and when to use each</li><li>Spot cognitive biases and logical fallacies</li><li>Recall Goleman's 5 EQ components and Tuckman's 5 stages</li><li>Choose among the 5 conflict-resolution styles</li><li>Compare leaders with managers, and transactional with transformational leaders</li></ul></div>
<h2>Analytical frameworks for decisions</h2>
<p>Frameworks give structure to a decision so that it does not rest on gut feeling alone.</p>
<div class="kwt-wrap"><table class="kwt"><tr><th>Framework</th><th>Key words to use in your response</th></tr>
<tr><td>SWOT</td><td><b>Strengths, Weaknesses</b> (internal) and <b>Opportunities, Threats</b> (external)</td></tr>
<tr><td>Opportunity-Cost</td><td>the <b>next best alternative</b> you give up; <b>trade-off</b></td></tr>
<tr><td>Root Cause</td><td><b>underlying source</b>, not the symptom; "5 Whys"</td></tr>
<tr><td>Pareto</td><td><b>80/20 principle</b>; the <b>vital few</b> causes produce most effects</td></tr></table></div>
${SWOT}
<h2>Cognitive biases</h2>
<h3 class="sec">Consider yourself in this situation</h3>
<div class="note"><strong class="t">Scenario</strong>You lead a small team and need to hire an intern. In the first interview, the candidate asks for <b>₹40,000</b> a month. Over the next two days you meet others who ask for <b>₹25,000</b>, and you feel pleased to hire one of them. You tell your manager, "I got a bargain." Later you learn the usual rate for this role is <b>₹15,000</b>.</div>
<p>Where did you go wrong? Nobody lied to you and you did not feel careless. But the <b>first number you heard</b> quietly became your reference point, so ₹25,000 <b>felt cheap</b> when it was actually high. You judged against the anchor instead of against the market.</p>
<p>That pitfall is a <b>cognitive bias</b>: a <b>systematic mental shortcut</b> that bends our judgement without our noticing. This one is called <b>anchoring bias</b>.</p>
<h3 class="sec">Why catching biases matters</h3>
<ul><li>Biases are <b>invisible from the inside</b>: a bad decision still feels perfectly reasonable.</li><li>They shape <b>hiring, money, grades and teamwork</b>, so small errors repeat and add up.</li><li>Once you can <b>name</b> a bias, you can <b>pause and check</b> it by asking, "What evidence would change my mind?"</li></ul>
<p>Researchers have catalogued <b>hundreds of cognitive biases</b>. The five below are enough for this course, but you are encouraged to <b>explore more out of your own interest</b>, for example the bandwagon effect, the availability heuristic or the Dunning-Kruger effect.</p>
<h3 class="sec">Five biases to know</h3>
<div class="kwt-wrap"><table class="kwt"><tr><th>Bias</th><th>Key words to use in your response</th><th>Quick example</th></tr>
<tr><td>Anchoring bias</td><td>relies too heavily on the <b>first piece of information</b></td><td>the first price quoted makes later prices seem cheap</td></tr>
<tr><td>Confirmation bias</td><td>seeks evidence that <b>supports existing beliefs</b></td><td>reading only articles that agree with your plan</td></tr>
<tr><td>Hindsight bias</td><td>"<b>I knew it all along</b>" after the outcome is known</td><td>"I knew that start-up would fail" once it has failed</td></tr>
<tr><td>Framing bias</td><td>choice shaped by <b>how information is presented</b></td><td>"90% survive" feels safer than "10% die"</td></tr>
<tr><td>Overconfidence bias</td><td><b>overestimating</b> your own knowledge or ability</td><td>promising to finish in two days and needing six</td></tr></table></div>
<div class="say">Say it like this: "The manager showed anchoring bias: the first salary quoted became the reference point, so later offers looked cheap."</div>
<h2>Logical fallacies</h2>
<h3 class="sec">Consider yourself in this situation</h3>
<div class="note"><strong class="t">Scenario</strong>Your four-person team has spent <b>three weeks</b> building an app for a class competition. A quick survey of 50 students shows almost nobody would use it. A teammate says, "We can't stop now. We've put three weeks into this, so we have to finish it." It sounds loyal and hard-working, and you nod along.</div>
<p>What went wrong? The argument treats time <b>already spent</b> as a reason to keep going. But those three weeks are gone whether you continue or not. The only sensible question is whether the <b>next</b> hours are better spent on this idea or a new one. This flaw in the reasoning is the <b>sunk-cost fallacy</b>.</p>
<h3 class="sec">Fallacy vs bias: what is the difference?</h3>
<p>A <b>cognitive bias</b> lives inside <b>how our mind works</b>. It is a mental shortcut that nudges us toward a conclusion without our noticing, which is why it usually feels like plain common sense. Because it is unconscious, you cannot easily point to the moment it happened, and it mainly distorts the <b>thinker's own judgement</b>. The fix is to <b>slow down</b> and deliberately look for disconfirming evidence, as when you stop anchoring on the first price you saw.</p>
<p>A <b>logical fallacy</b> lives in the <b>structure of an argument</b>: the link between the reasons and the conclusion is faulty. Unlike a bias, you can <b>point to the broken step</b> in what someone said or wrote, and it affects the <b>audience</b> too, since a fallacy can persuade others, on purpose or by accident. The fix is to <b>test the argument</b> and ask whether the evidence really supports the claim, as in "We have invested too much to quit".</p>
<p>The two often work together: a bias (we hate admitting a loss) can lead us to <b>use</b> a fallacy (sunk cost) to justify staying put.</p>
<h3 class="sec">Three fallacies to know</h3>
<div class="kwt-wrap"><table class="kwt"><tr><th>Fallacy</th><th>Key words to use in your response</th><th>Quick example</th></tr>
<tr><td>Sunk-cost fallacy</td><td>continuing because of <b>past investment</b> that cannot be recovered</td><td>"I paid for the course, so I must finish it" even though it is useless</td></tr>
<tr><td>Authority fallacy</td><td>true "because an <b>authority said so</b>", not because of evidence (extreme case: the <b>Dr. Fox effect</b>, below)</td><td>"A famous actor says this supplement works"</td></tr>
<tr><td>Causal fallacy</td><td>assuming <b>correlation means causation</b></td><td>ice-cream sales and drownings both rise, so "ice cream causes drowning" (hot weather causes both)</td></tr></table></div>
<h3 class="sec">The Dr. Fox experiment: when authority has nothing inside</h3>
<p>The authority fallacy has a famous extreme case. In the early 1970s, three medical educators (<b>Naftulin, Ware and Donnelly</b>) hired a professional actor, <b>Michael Fox</b>, and introduced him to an audience of psychiatrists, psychologists and educators as <b>Dr. Myron L. Fox</b>, an expert on applying mathematics to human behaviour. He had never studied the subject. He was coached to deliver a lecture titled <b>"Mathematical Game Theory as Applied to Physical Education"</b> with warmth, humour, confident gestures and a polished manner, while filling it with <b>double talk</b>: invented jargon, contradictions, non sequiturs and impressive-sounding sentences that meant nothing. He then took questions in the same style.</p>
<p>The result shocked the researchers. The audience rated the session highly, said it was well organised and stimulating, and <b>nobody realised the content was empty</b>. These were trained professionals, so intelligence and education did not protect them. The finding became known as the <b>Dr. Fox effect</b>: an impressive title plus a confident, fluent delivery can make nonsense feel like insight.</p>
<h3 class="sec">Why it is the end-stage of the appeal to authority</h3>
<p>Think of the authority fallacy as a slope. At the top, the authority is at least <b>relevant</b> but over-trusted. Lower down, it is <b>irrelevant</b>. At the bottom, the authority <b>replaces the content entirely</b>, and that is Dr. Fox: the listener supplies the meaning, because a credentialed, confident person must be saying something deep.</p>
<div class="kwt-wrap"><table class="kwt"><tr><th>Stage</th><th>What the argument leans on</th><th>Example</th></tr>
<tr><td>1. Over-trusted expert</td><td>a <b>relevant</b> expert, but used instead of checking the evidence</td><td>"A senior engineer said this design is safe, so no review is needed"</td></tr>
<tr><td>2. Irrelevant authority</td><td>fame or a title <b>outside</b> the topic</td><td>"A famous actor says this supplement works"</td></tr>
<tr><td>3. Authority as the argument</td><td>the title <b>is</b> the only reason given</td><td>"Dr. Rao says so, end of discussion"</td></tr>
<tr><td>4. Dr. Fox (end-stage)</td><td>authority plus delivery, with <b>no real content at all</b>: double talk is heard as meaningful</td><td>a confident speaker piles up buzzwords ("synergistic paradigm of scalable holistic alignment") and the room nods</td></tr></table></div>
<p>The deeper lesson is that listeners often use <b>fluency as a shortcut for truth</b>: smooth, confident, jargon-rich speech feels intelligent. It also works on <b>you</b> when you are the speaker, because a confident delivery can hide thin preparation. That is why this module keeps returning to evidence.</p>
<div class="why"><b class="t">How to guard against it</b>Ask three questions of any impressive talk or text: <b>(1) What exactly is the claim?</b> <b>(2) What is the evidence?</b> <b>(3) Can I restate it in one plain sentence?</b> If you cannot restate it, the problem may be the speaker, not you. Jargon that cannot be explained in simple words is a warning sign.</div>
<p><b>A fair caution.</b> The original demonstration was small and informal, not a controlled experiment, and later studies found that an expressive style raises <b>satisfaction ratings</b> much more than it raises <b>actual learning</b>. Treat the story as a vivid warning about how easily delivery can pass for substance, not as proof that audiences are always fooled.</p>
<details class="qc"><summary>Quick check: a speaker with a grand title uses long, technical-sounding sentences, and the audience praises the talk but nobody can say what it claimed. Which effect?</summary><p>The <b>Dr. Fox effect</b>, the end-stage of the authority fallacy: authority and confident delivery are mistaken for content, so double talk is perceived as meaningful.</p></details>
<h2>Emotional intelligence (Daniel Goleman)</h2>
<h3 class="sec">Why we need it</h3>
<p>Skills and knowledge get you in the door, but <b>emotional intelligence (EI)</b> is the <b>unsung glue</b> that holds relationships together, professional and personal. It is the ability to <b>recognise, understand and manage emotions</b>, your own and other people's. Teams with the same talent but low EI have more misunderstandings, defensiveness and silent resentment.</p>
<h3 class="sec">Consider yourself in this situation</h3>
<div class="note"><strong class="t">Think about these people</strong>At home, there is that one person who <b>rarely says much</b> but always seems to know when you are stressed, and quietly adjusts, perhaps by making you tea or lowering the TV. Among your friends, there is the person who is <b>always there for others</b>, remembers what is going on in your life and shows up when it matters.</div>
<p>Neither is giving a speech, yet people feel <b>safe and understood</b> around them. That is emotional intelligence at work: <b>noticing feelings</b> (empathy), <b>staying steady</b> (self-regulation) and <b>caring enough to act</b> (social skills). One caution: EI also includes <b>self-awareness</b>, so its strongest form is not endless accommodating. It balances caring for others with <b>speaking up for your own needs</b>.</p>
<h3 class="sec">Goleman's five components</h3>
<div class="kwt-wrap"><table class="kwt"><tr><th>Component</th><th>Key words to use in your response</th><th>In practice</th></tr>
<tr><td>Self-awareness</td><td>recognising <b>your own emotions</b> and their effect on others</td><td>"I notice I am getting defensive."</td></tr>
<tr><td>Self-regulation</td><td>managing <b>impulses</b> and staying calm</td><td>pausing before replying to a rude email</td></tr>
<tr><td>Intrinsic motivation</td><td>driven by <b>inner goals</b>, not only rewards</td><td>studying because you want to master the skill</td></tr>
<tr><td>Empathy</td><td>understanding <b>other people's feelings</b></td><td>noticing a teammate is overwhelmed</td></tr>
<tr><td>Social skills</td><td><b>managing relationships</b>, communication, influence, teamwork</td><td>resolving a disagreement so both sides feel heard</td></tr></table></div>
<p>The first three are about <b>managing yourself</b>; the last two are about <b>managing relationships</b>.</p>
<h3 class="sec">Why it matters in the workplace and in college life</h3>
<p>In the <b>workplace</b>, almost every outcome runs through people. A manager with high EI notices when a team member is quietly struggling, gives feedback without crushing morale, and stays composed when a client is angry. Colleagues with high EI disagree without turning it personal, which keeps projects moving and makes people willing to share problems early rather than hide them. This is why employers promote and hire for it: technical skill gets work done, but emotional intelligence decides whether a team can <b>keep working together</b> under pressure.</p>
<p>In <b>college life</b>, EI shows up in group assignments, hostel living, club leadership and exam stress. Self-regulation helps you handle a bad internal mark without spiralling or lashing out at a friend. Empathy helps you notice that a project partner who has gone quiet may be overwhelmed rather than lazy. Self-awareness helps you see when your own nervousness is making you defensive in a viva. Students who build these habits tend to have stronger friendships, smoother teamwork and better recovery from setbacks, and they carry the same skills straight into their first job.</p>
<h2>Group development</h2>
<h3 class="sec">Introduction</h3>
<p>Every team passes through predictable phases. Psychologist <b>Bruce Tuckman</b> described <b>Forming, Storming, Norming and Performing</b> in 1965 and added <b>Adjourning</b> in 1977. Knowing the stage tells a leader what the team needs next, and some teams get stuck in <b>storming</b>.</p>
<h3 class="sec">Tuckman's five stages</h3>
${fig(chain(['F','S','N','P','A'],['Forming','Storming','Norming','Performing','Adjourning'],['Polite,|unsure','Conflict,|power plays','Rules and|trust form','High output,|teamwork','Task ends,|team disbands'],'Tuckman five stages'),'Mnemonic: "Fun Stories Never Pass Away".','five rectangles in a row joined by arrows, letters F S N P A inside, stage names underneath.')}
${CURVE}
<div class="kwt-wrap"><table class="kwt"><tr><th>Stage</th><th>What it looks like</th><th>Leader's move</th></tr>
<tr><td>Forming</td><td><b>polite</b>, uncertain, dependent on the leader, <b>unclear roles</b></td><td>give <b>clear goals</b> and introductions</td></tr>
<tr><td>Storming</td><td><b>conflict</b>, power struggles, clashing styles</td><td><b>listen</b>, mediate, clarify <b>roles</b></td></tr>
<tr><td>Norming</td><td><b>agreed norms</b>, trust, cohesion</td><td>reinforce <b>shared rules</b> and feedback</td></tr>
<tr><td>Performing</td><td><b>high output</b>, autonomy, problem solving</td><td><b>delegate</b> and stretch goals</td></tr>
<tr><td>Adjourning</td><td>task ends, <b>mixed emotions</b></td><td><b>celebrate</b> and record lessons learned</td></tr></table></div>
<h3 class="sec">Techniques to reach norming and optimal outcomes <span class="tag-new">NEW</span></h3>
<p>Teams rarely reach norming by luck. Three techniques build <b>clear roles, clear ownership and shared norms</b> early, which shortens storming. They do different jobs: <b>Belbin evaluates</b> the group, the <b>DRI leads</b> it, and the <b>RACI matrix organises</b> the work.</p>
<h3 class="sec">1. Belbin Team Roles: evaluating the whole group</h3>
<p><b>Meredith Belbin</b> found that effective teams need a <b>balance of behaviours</b>, not identical people. He identified <b>nine team roles</b> in three groups, each with <b>strengths</b> and <b>allowable weaknesses</b>.</p>
${BELBIN}
<p><b>How it is used:</b> think of Belbin as a <b>holistic checklist</b> for the whole group. <b>External evaluators</b> (a mentor, instructor or manager) or the team itself can run through the nine roles and ask: <b>which roles are covered, which are missing, and which are overloaded?</b> It does not assign tasks. It shows <b>what the team might be lacking</b>, such as nobody who checks details (no Completer Finisher) or too many Shapers competing. Style clashes also start to look like <b>complementary strengths</b> rather than conflict.</p>
<h3 class="sec">2. The DRI Model: one person to lead and decide</h3>
<p><b>Why the DRI exists:</b> in a team where everyone has an <b>equal say</b>, every decision needs everyone's agreement. That sounds fair but often leads to <b>ego fights</b>, endless debate and work that <b>never gets done</b>. A team needs someone at a <b>higher level</b> to <b>administer the work and pull the shots</b> when opinions conflict. The <b>Directly Responsible Individual (DRI)</b>, popularised at Apple, is that one named person who is <b>answerable for the outcome</b>.</p>
<p>The DRI is not a dictator and does not do everything alone. Team members, <b>key stakeholders</b> and <b>subject matter experts</b> give input, then the DRI <b>decides and takes responsibility</b>. This also prevents <b>diffusion of responsibility</b>, where everyone assumes someone else will act.</p>
${DRI}
<h3 class="sec">3. RACI Matrix: how the DRI organises the team's work</h3>
<p>Once a DRI is in place, the DRI can use a <b>RACI matrix</b> to run the work inside the team. The DRI is usually the <b>Accountable</b> person for the deliverable, and uses the matrix to decide who is <b>Responsible</b> for each task, who must be <b>Consulted</b>, and who only needs to be <b>Informed</b>. This removes the <b>role ambiguity</b> that causes storming.</p>
${RACI}
<p><b>Rules:</b> exactly <b>one Accountable</b> per task, at least <b>one Responsible</b>, and keep <b>Consulted</b> short to avoid slow decisions.</p>
<div class="kwt-wrap"><table class="kwt"><tr><th>Technique</th><th>Its job</th><th>Question it answers</th></tr>
<tr><td>Belbin</td><td><b>evaluate</b> the whole group</td><td>Which roles are <b>covered or missing</b>?</td></tr>
<tr><td>DRI</td><td><b>lead and decide</b></td><td>Who is <b>answerable</b> for the outcome?</td></tr>
<tr><td>RACI</td><td><b>organise</b> the tasks</td><td><b>Who does what</b>?</td></tr></table></div>
<div class="say">Say it like this: "We used Belbin to check that no role was missing, named one DRI to break ties and own the outcome, and the DRI used a RACI matrix to assign tasks. That helped us reach norming quickly."</div>
<h2>Conflict-resolution styles</h2>
<h3 class="sec">Why do we have different styles?</h3>
<p>Conflict is <b>normal</b>: people have different goals, values and personalities. No single response works everywhere, so people lean towards different styles depending on their <b>personality, upbringing and culture, the power balance, and how much is at stake</b>. The five styles come from two questions: <b>how much do I care about my own goals</b> (assertiveness) and <b>how much do I care about the relationship</b> (cooperativeness)?</p>
<ul><li><b>Competition</b>: win-lose; you pursue your own goal</li><li><b>Collaboration</b>: win-win; you solve it together</li><li><b>Compromise</b>: <b>both</b> sides give up <b>part</b> of what they want</li><li><b>Accommodation</b>: <b>one</b> side gives in fully to keep the peace</li><li><b>Avoidance</b>: you <b>withdraw or postpone</b> the issue</li></ul>
<h3 class="sec">Is avoiding a problem ever the right choice?</h3>
<p>Many people wonder this, because avoidance sounds like running away. It can be right when it is <b>deliberate and temporary</b>, such as when emotions are high, the issue is small, or you need more information.</p>
<div class="note"><strong class="t">Example: a romantic relationship</strong>Your partner comes home after a terrible day and snaps at you about the dishes. Arguing right now would <b>escalate</b> a small thing into a big fight. You choose to let it go for the evening, give some space, and mention how it felt the <b>next day when you are both calm</b>. That is avoidance used as a <b>cooling-off period</b>, and it protects the relationship.</div>
<p>It becomes harmful when it is <b>chronic</b>: an important issue is postponed again and again, so <b>resentment builds</b>. Healthy avoidance has a plan to return to the topic.</p>
<h3 class="sec">Accommodation vs compromise: a group project</h3>
<p>These two are often confused. The difference is <b>who gives something up</b>.</p>
<div class="note"><strong class="t">Group project scenario</strong>Two teammates disagree about the slide design: Riya wants a dark theme and Sam wants a light theme.</div>
<div class="kwt-wrap"><table class="kwt"><tr><th>Style</th><th>What happens</th><th>Who gives up</th><th>Risk</th></tr>
<tr><td>Compromise</td><td>Riya uses <b>her layout</b> but with <b>Sam's colours</b>; each gets part of what they wanted</td><td><b>both</b>, partly</td><td>nobody fully satisfied</td></tr>
<tr><td>Accommodation</td><td>Riya says, "Fine, use your design" and asks for <b>nothing in return</b></td><td><b>one person</b>, fully</td><td>hidden resentment if it keeps happening</td></tr></table></div>
<p>A <b>collaboration</b> solution would be different again: they ask <b>why</b> each wants their theme (readability in a bright room versus a modern look) and design something that meets both needs.</p>
<details class="qc"><summary>Quick check: a manager keeps funding a failing project "because we've already spent so much". Which fallacy?</summary><p>The <b>sunk-cost fallacy</b>: past investment that cannot be recovered should not decide future spending.</p></details>
<h2>Leadership &amp; Influence <span class="tag-new">NEW</span></h2>
<h3 class="sec">What a leader is and how to become one</h3>
<p>A <b>leader</b> is a person who <b>influences others to move towards a shared goal</b>, whether or not they hold a title. A class representative who rallies a team before a deadline is leading; a senior manager who only forwards instructions may not be. That is why leadership is better seen as a <b>behaviour you practise</b> than a position you are given.</p>
<p>Leaders are made more than born. You become one by <b>taking ownership</b> of small problems (a group project, a club event), <b>building trust</b> by keeping your promises, <b>listening before deciding</b>, and <b>learning from feedback</b>. Over time, people start following you because they <b>want</b> to, not because they have to.</p>
<p>Across most models, effective leaders are <b>visionary</b>, <b>inspirational</b>, <b>ethical</b>, <b>innovative</b> and <b>future-oriented</b>, and they combine <b>emotional intelligence</b> and <b>empathy</b> with <b>confidence</b>, <b>trustworthiness</b> and <b>clear communication</b>. Notice how many of these come straight from skills in this unit: EQ, conflict handling and group development.</p>
<h3 class="sec">Leader vs manager</h3>
<p>The two roles overlap, and one person often plays both, but their <b>centre of gravity</b> differs.</p>
<div class="kwt-wrap"><table class="kwt"><tr><th></th><th>Leader</th><th>Manager</th></tr>
<tr><td>Core job</td><td><b>Creates a vision</b> and inspires people towards it</td><td><b>Executes plans</b> and controls processes</td></tr>
<tr><td>Focus</td><td><b>Change</b> and innovation</td><td><b>Stability</b> and efficiency</td></tr>
<tr><td>Source of influence</td><td><b>Motivation</b></td><td><b>Authority</b></td></tr></table></div>
<h3 class="sec">Persuasive tactics leaders use</h3>
<p>Leaders rarely get results by giving orders alone; they <b>persuade</b>. The most common tactics are the ones you will meet again in Unit 3. They build <b>credibility</b> (ethos) by being consistent and honest, appeal to <b>emotion</b> (pathos) through <b>stories</b> and a <b>shared vision</b> that makes people feel part of something, and back their case with <b>evidence</b> (logos). They also use <b>social proof</b> ("the other teams have already adopted this"), <b>reciprocity</b> (helping first, so that support comes back naturally), and <b>framing</b>, which presents a change as a gain to be won rather than a loss to be feared. The skilled leader also <b>listens first</b>, because people are far more open to an idea after they feel heard.</p>
<h3 class="sec">Transactional vs transformational leaders</h3>
<p>A <b>transactional leader</b> achieves goals through a <b>system of rewards and penalties</b>. The style stresses <b>clear goals, rules and procedures, task performance, formal authority and close supervision</b>: meet the target and you are rewarded; miss it and there are consequences. A <b>transformational leader</b> instead <b>inspires people to go beyond their own self-interest</b> for a larger purpose. They bring a vision, show genuine care for each person's growth, and encourage innovation and independent thinking. Both rely on <b>persuasion</b>, but one persuades through <b>exchange</b> and the other through <b>inspiration</b>.</p>
<div class="kwt-wrap"><table class="kwt"><tr><th></th><th>Transactional</th><th>Transformational</th></tr>
<tr><td>How people are motivated</td><td><b>Rewards and penalties</b></td><td><b>Inspiration</b> and a shared vision</td></tr>
<tr><td>Main focus</td><td><b>Rules, tasks</b> and performance now</td><td><b>People, growth</b> and the future</td></tr>
<tr><td>Style of control</td><td><b>Formal authority</b> and close supervision</td><td><b>Empathy</b> and empowerment</td></tr></table></div>
<h3 class="sec">Why both are needed: Lee Kuan Yew</h3>
<p>Neither type is enough alone. A purely transactional leader keeps the machine running but cannot move people past what is demanded; a purely transformational one inspires but may lack the discipline to turn the dream into results. <b>Lee Kuan Yew</b>, Singapore's first Prime Minister (1959 to 1990), is a classic example of a leader who <b>blended both</b>. His <b>transformational</b> side was a bold vision of lifting a small, resource-poor island that had just been pushed out of Malaysia in 1965 from "Third World to First", which he sold through speeches, a bilingual national identity and the "Garden City" idea. His <b>transactional</b> side was a strict system to deliver it: tough anti-corruption enforcement, high pay for ministers and civil servants tied to performance and merit, clear laws with firm penalties, and tight control of how policy was carried out. Singapore's income per person rose from roughly US$500 in 1965 to above US$50,000 within about fifty years.</p>
<div class="why"><b class="t">Balanced view</b>Lee's critics point out that his transactional side included restrictions on the press and political opposition, which many consider too high a price. The example shows why <b>both styles are necessary</b>: vision supplies the <b>direction</b> and the willingness to follow, while structure and consequences supply the <b>delivery</b>. A good leader chooses the style the situation needs, with transactional methods for crises and routine deadlines and transformational ones for change and growth.</div>
<h3 class="sec">Transformational without being a push-over</h3>
<p>The risk of the empathetic, people-first style is that kindness turns into <b>accommodation</b> (Unit 1, conflict styles): you say yes to everyone, avoid hard conversations, and the team learns that standards are optional. Caring about people and holding them to a standard are <b>not opposites</b>. Be <b>warm on the person and firm on the standard</b>: listen fully, acknowledge feelings, and still say a clear no when needed, with the reason. Agree on <b>expectations and deadlines</b> up front, so that accountability feels fair instead of personal. Follow through on what you said, because a leader who never acts on missed commitments loses credibility fast. Listen widely, then <b>decide and own the decision</b> (the DRI idea), rather than waiting for everyone to agree. Remember that <b>empathy means understanding someone's position, not giving in to it</b>. If you need a short script, try: "I understand why this is hard, and the deadline still stands. What support do you need to meet it?"</p>
<details class="qc"><summary>Quick check: which leadership style rewards targets met and penalises targets missed?</summary><p><b>Transactional</b> leadership, based on an exchange of rewards and penalties. Transformational leaders instead motivate through vision and inspiration.</p></details>
