</div>
<div class="why"><b class="t">Why this works</b>Keywords such as <b>preventive maintenance, calibration, ECG, IEC 60601</b> match a typical biomedical job post. Every bullet starts with a verb and carries a number, and the project shows both <b>hardware and software</b> ability.</div>
<h3 class="sec">Example 2: resume for an Information Technology role</h3>
<p>Target job: <b>Associate Software Engineer (full-stack)</b>. Phone numbers, emails and the organisations named below are placeholders.</p>
<div class="rdoc"><span class="rtag">Sample: Information Technology</span>
<h4>BALAMUTHUKRISHNAN</h4>
<div class="rc">Chennai, Tamil Nadu | +91 97xxx xxxxx | balamuthukrishnan@email.com | linkedin.com/in/balamuthukrishnan | github.com/balamuthukrishnan</div>
<div class="rh">Summary</div>
<p>B.Tech Information Technology graduate with strong foundations in data structures and full-stack web development. Experienced in building and deploying REST-based applications with React, Node.js and MongoDB. Seeking an Associate Software Engineer role.</p>
<div class="rh">Education</div>
<div class="rrow"><span>B.Tech Information Technology, XYZ Institute of Technology, Chennai</span><span>2022 &ndash; 2026</span></div>
<p>CGPA: 8.1 / 10. Coursework: Data Structures and Algorithms, DBMS, Operating Systems, Computer Networks, Software Engineering.</p>
<div class="rh">Experience</div>
<div class="rrow"><span>Web Development Intern, ABC Technologies (startup)</span><span>June &ndash; July 2025</span></div>
<ul><li>Built <b>5 reusable React components</b> adopted across the company dashboard, reducing duplicate code.</li><li>Cut page load time by <b>30%</b> using lazy loading and image compression.</li><li>Fixed 12 front-end bugs from the issue tracker and wrote the release notes for each fix.</li></ul>
<div class="rh">Projects</div>
<div class="rrow"><span>Campus Event Booking Platform (React, Node.js, MongoDB)</span><span>GitHub link</span></div>
<ul><li>Designed a booking system with login, seat limits and email confirmation, used by <b>3 departments</b> for <b>400+ registrations</b>.</li><li>Built <b>12 REST endpoints</b> with JWT authentication and reached <b>90% unit-test coverage</b> using Jest.</li></ul>
<div class="rrow"><span>Expense Tracker API (Java, Spring Boot, MySQL)</span><span>GitHub link</span></div>
<ul><li>Created a REST API with role-based access and documented it in Postman for easy testing.</li></ul>
<div class="rh">Skills</div>
<p><b>Languages:</b> Java, Python, JavaScript, SQL | <b>Frameworks:</b> React, Node.js, Spring Boot | <b>Tools:</b> Git, GitHub, Docker (basics), Postman | <b>Core:</b> Data Structures, OOP, REST APIs</p>
<div class="rh">Certifications and achievements</div>
<ul><li>NPTEL: Data Structures and Algorithms (course completion) | Solved 250+ coding problems on an online judge | Finalist, college hackathon</li></ul>
</div>
<div class="why"><b class="t">Why this works</b>The skills are <b>grouped</b> so an ATS finds them quickly, and a <b>GitHub link</b> gives proof. Bullets say <b>what was built, with which tools, and for whom</b>, and the numbers (400+ registrations, 30% faster, 90% coverage) turn claims into evidence.</div>
<h3 class="sec">The cover letter</h3>
<p>A cover letter explains <b>why you, for this role</b>, in a way that a resume cannot. Keep it to <b>three short paragraphs</b>, under one page, and address a <b>named person</b> where possible. Do not repeat the resume; pick one or two points from it and tell the story behind them.</p>
<ol><li><b>Hook:</b> the role you are applying for and one reason you are excited about this company.</li><li><b>Evidence of fit:</b> one or two specific achievements that match the job description.</li><li><b>Call to action:</b> thank the reader and ask for an opportunity to discuss.</li></ol>
<div class="rdoc letter"><span class="rtag">Sample letter: Biomedical Engineering</span>
<p>Dear Ms. Sharma,</p>
<p>I am writing to apply for the Junior Biomedical Engineer position at HealthTech Devices. During my internship at a multi-speciality hospital, I saw how a single uncalibrated infusion pump can affect patient safety, and that experience is why I want to work for a company that builds and services dependable clinical equipment.</p>
<p>In my internship I helped maintain more than 30 devices, including ventilators and defibrillators, and flagged four units for recalibration before use. In my final-year project I designed an ECG acquisition circuit with a MATLAB filter that improved signal clarity across recordings from 20 volunteers. These experiences gave me both the hands-on and the analytical skills your job description asks for.</p>
<p>I would welcome the chance to discuss how I can support your service and testing team. Thank you for your time and consideration.</p>
<p>Sincerely,<br>Shruthi Sankar</p>
</div>
<div class="rdoc letter"><span class="rtag">Sample letter: Information Technology</span>
<p>Dear Mr. Rao,</p>
<p>I would like to apply for the Associate Software Engineer role at BrightApps. I have followed your products for the past year, and I was especially drawn to how your team ships small, well-tested features quickly. That is the way I like to build software.</p>
<p>As a web development intern, I built five reusable React components and cut page load time by 30%. For my campus event-booking platform, I wrote 12 REST endpoints with JWT authentication and reached 90% test coverage, and three departments now use it for over 400 registrations. You can see the code on my GitHub page.</p>
<p>I would be glad to talk about how I can contribute to your engineering team. Thank you for considering my application.</p>
<p>Yours sincerely,<br>Balamuthukrishnan</p>
</div>
<div class="why"><b class="t">Notice</b>Each letter names the company and a specific reason, picks <b>two pieces of evidence</b> and ends with a polite call to action. A generic letter that could be sent to any company is easy for the reader to spot and ignore.</div>
<h3 class="sec">Statement of Purpose (SOP)</h3>
<p>An SOP is used for <b>admissions to higher studies</b> and some scholarships. Unlike a cover letter, it is a personal essay of about 500 to 1,000 words. It answers four questions in order: <b>What are your goals?</b> <b>How have you prepared?</b> <b>Why this programme and this university?</b> <b>What will you do afterwards?</b> Open with a specific moment or problem that sparked your interest, not with a general statement such as "Since childhood I have been passionate about...". Write in your own voice, give examples, and name the professors, labs or courses that fit your plan.</p>
<h2>Executive presence <span class="tag-new">NEW</span></h2>
<p>Executive presence is the quality that makes people <b>trust you to lead</b>, even before you have a senior title. In an interview, the interviewer is asking an unspoken question: "Could I put this person in front of a client or a senior manager?" Three pillars answer that question.</p>
<ul><li><b>Confidence:</b> a steady voice, upright posture, eye contact and few filler words ("um", "like", "you know"). Confidence is mostly <b>preparation</b>; it is hard to sound sure about answers you have not practised.</li><li><b>Authority:</b> clear, concise statements. Lead with the <b>answer</b> or recommendation, then give the reasons. "I would choose option B, for two reasons" sounds more authoritative than a long build-up.</li><li><b>Credibility:</b> consistent, evidence-backed answers. Use numbers and specific examples, and be honest about what you do not know. Saying "I have not used that tool, but I learned a similar one in two weeks" builds more credibility than bluffing.</li></ul>
<p><b>A useful habit is to pause.</b> A one- or two-second pause before answering signals thought, gives you time to structure the answer and prevents rushing. Pair it with a strong opening line and a clear closing line, so the answer feels finished. For online interviews, add a stable camera at eye level, good lighting and a quiet background, as covered in virtual presentation skills.</p>
<h2>A practical guide to interviews <span class="tag-new">NEW</span></h2>
<p>STAR and SCORE tell you <b>how to shape an answer</b>. This module tells you <b>how to get ready, what to avoid, and how to practise</b>, so that your answers come out well on the day.</p>
<h3 class="sec">How to prepare</h3>
<ol><li><b>Research the organisation and the role.</b> Know what the company does, its products and values, and why you want <b>this</b> job.</li><li><b>Match your resume to the job description.</b> Note the key skills and prepare one example for each.</li><li><b>Prepare your stories:</b> five STAR or SCORE stories, plus a 60-second answer to "Tell me about yourself".</li><li><b>Prepare questions to ask them</b>, about the team, training or the first six months.</li><li><b>Sort the logistics:</b> documents, route and timing, or for online interviews a tested camera, audio and internet.</li><li><b>Rehearse aloud</b> with a friend, a mentor or a recording. Reading answers silently is not practice.</li></ol>
<h3 class="sec">Common mistakes and what to avoid</h3>
<div class="kwt-wrap"><table class="kwt"><tr><th>Mistake</th><th>Do this instead</th></tr>
<tr><td>Arriving unprepared</td><td>Research the role and rehearse your stories</td></tr>
<tr><td>Memorising answers word for word</td><td>Memorise the structure and key points, then speak naturally</td></tr>
<tr><td>Avoiding eye contact</td><td>Look at the person speaking, and share glances with the others</td></tr>
<tr><td>Very long answers</td><td>State your main point first; keep answers to about 90 seconds to two minutes</td></tr>
<tr><td>Speaking too softly or too quickly</td><td>Slow down, pause, and project to the back of the room</td></tr>
<tr><td>Interrupting the interviewer</td><td>Let them finish, then take a breath before answering</td></tr>
<tr><td>Too much technical jargon</td><td>Explain in plain words, as if to a smart non-expert</td></tr>
<tr><td>Criticising past teams or employers</td><td>Describe what you learned and how you handled it</td></tr>
<tr><td>No examples</td><td>Give a specific story with a result for every claim</td></tr>
<tr><td>Becoming defensive about feedback</td><td>Listen, say thank you and ask a follow-up question</td></tr>
<tr><td>Ignoring some interviewers</td><td>Answer the person who asked, but include everyone</td></tr></table></div>
<h3 class="sec">Panel interviews: what to expect</h3>
<p>Many interviews are held by a <b>panel of two or more people</b>, each testing something different. Expect follow-up questions and varied styles.</p>
<div class="kwt-wrap"><table class="kwt"><tr><th>Panel member</th><th>Assesses</th><th>Sample question</th></tr>
<tr><td>HR professional</td><td>Communication, attitude, adaptability, cultural fit</td><td>"Why are you interested in this organisation?"</td></tr>
<tr><td>Technical expert</td><td>Knowledge and problem-solving</td><td>"What challenges did you meet in your final-year project?"</td></tr>
<tr><td>Project manager</td><td>Teamwork, leadership, decision-making</td><td>"Tell us about a disagreement with a team member."</td></tr>
<tr><td>Situational question</td><td>Judgement under pressure</td><td>"What would you do if your team missed a key deadline?"</td></tr></table></div>
<div class="say">Opening introduction: "Good morning. I am a final-year engineering student specialising in computer science. My interests include artificial intelligence and data analytics. In my recent project I built a machine-learning model to predict crop diseases, which strengthened my technical and teamwork skills."</div>
<h3 class="sec">Why mock interviews matter</h3>
<p>A <b>mock interview</b> is a simulated interview, ideally with a panel that includes industry professionals, followed by feedback. Needing practice does <b>not</b> mean you are flawed. Athletes, musicians and surgeons rehearse constantly because <b>skill under pressure is trained, not inherited</b>. Practice makes the setting <b>familiar</b>, and familiarity reduces fear, so your real knowledge shows on the day. It also builds <b>confidence</b>, sharpens your communication and non-verbal skills, and lets you make mistakes where they cost nothing.</p>
<p>Industry feedback is especially valuable because it shows the gap between <b>academic readiness</b> and <b>workplace readiness</b>, which you cannot always see yourself. Good feedback is <b>specific, constructive, evidence-based and action-oriented</b>. Compare these two:</p>
<div class="kwt-wrap"><table class="kwt"><tr><th>Weak feedback</th><th>Strong feedback</th></tr>
<tr><td>"Your communication needs improvement."</td><td>"Your ideas were relevant, but several answers ran long. Use STAR and put your main point in the first sentence."</td></tr></table></div>
<p>After each mock, run the cycle: <b>Prepare, Simulate, Respond, Receive feedback, Reflect, Improve, Rehearse again</b>. This is the Act, Measure Feedback, Adjust loop from Unit 5 applied to interviews. Take one improvement per round and stay open: a mock that goes badly is a "respawn point", not a verdict.</p>
<details class="qc"><summary>Quick check: a friend says "I do not need mock interviews, only weak candidates do." How do you reply?</summary><p>Practice is how <b>all</b> strong performers build familiarity and confidence. It shows commitment, not weakness, and feedback reveals gaps you cannot see alone.</p></details>
<h2>Negotiation in interviews <span class="tag-new">NEW</span></h2>
<p>Negotiation begins <b>after</b> an offer, or when you are asked about salary expectations. Many freshers accept the first number out of fear that the offer will be withdrawn. In practice, a polite, well-researched counter-offer is normal and is usually respected. The goal is a <b>fair package</b> that both sides are happy with.</p>
<ol><li><b>Research</b> the market salary range for the role, city and company size, using job portals, alumni and campus-placement data.</li><li>Let the employer give the first number if possible. If you must go first, <b>anchor</b> at the high end of a reasonable range, because the first number shapes the conversation.</li><li>Know your <b>BATNA</b> (best alternative to a negotiated agreement) and your walk-away point. A second offer or a plan to pursue higher studies makes you calmer and stronger.</li><li>Respond to a <b>counter-offer</b> by weighing the whole package: joining bonus, variable pay, training, <b>learning opportunities</b>, work flexibility and growth path, not just fixed salary.</li><li>Stay <b>courteous and collaborative</b>. Ask "Is there flexibility on this?" rather than making demands, and always <b>get the final terms in writing</b>.</li></ol>
<div class="say">Say it like this: "Thank you, I am excited about the role. Based on my research for similar positions in Chennai, I was expecting a range of 5.5 to 6 lakh per annum. Is there flexibility to move closer to that?"</div>
<details class="qc"><summary>Quick check: which method has a step for a problem that arose?</summary><p><b>SCORE</b>, through its <b>Complication</b> and <b>Remedial Action</b> steps. STAR has no such step, so use SCORE for stories about failure or recovery.</p></details>`},

<div class="obj"><strong>What you will learn</strong><ul><li>Write SMART goals and OKRs</li><li>Build a personal brand: website, online presence and LinkedIn <span class="tag-new">NEW</span></li><li>Craft a confident, not cocky, elevator pitch <span class="tag-new">NEW</span></li><li>Build resilience, adaptability and a continuous feedback habit: <b>Act, Measure Feedback, Adjust</b> <span class="tag-new">NEW</span></li><li>Use the Super Mario Effect to learn from failure <span class="tag-new">NEW</span></li><li>Use mentorship and networking <span class="tag-new">NEW</span></li></ul></div>
<h2>SMART goals</h2>
${fig(chain(['S','M','A','R','T'],['Specific','Measurable','Achievable','Relevant','Time-bound'],['Clear,|not vague','Numbers to|track progress','Realistic|with effort','Aligned with|bigger aims','Has a|deadline'],'SMART goals'),'Example: "Increase my LinkedIn connections from 200 to 400 by 31 March by contacting 5 alumni a week."','five rectangles in a row, arrows between them, letters S M A R T inside, one cue under each.')}
<p>SMART is not just a tidy checklist. It is a <b>motivation tool</b>. Research on goal setting by Edwin Locke and Gary Latham found that <b>specific, challenging goals</b> lead to better performance than vague advice such as "do your best", because a clear target tells you what to do next and lets you judge how you are doing. But a goal only helps if you <b>keep going</b>, and that depends on whether you believe it can be done.</p>
<h3 class="sec">Why "achievable" protects your motivation</h3>
<p>Think of a goal as a jump. If the bar is <b>too low</b>, you clear it without effort and feel nothing: no growth, no pride. If it is <b>too high</b>, every week shows you how far away it still is, and people quietly give up. The sweet spot is <b>a stretch that you can reach with real effort</b>. Psychologist Albert Bandura called the belief "I can do this" <b>self-efficacy</b>, and it strongly shapes how hard you try and how long you persist after a setback. An achievable goal builds that belief; an impossible one erodes it.</p>
<p>Achievable also feeds a second motor of motivation: <b>visible progress</b>. In studies of people's daily work diaries, Teresa Amabile and Steven Kramer found that the best days were usually the days on which people made progress on something meaningful, even a small step. This is called the <b>progress principle</b>. A goal that you can finish in weeks gives you <b>small wins</b> to celebrate along the way, while a goal that needs three years of luck gives you nothing to feel good about until the end.</p>
<p><b>Achievable does not mean easy.</b> It means realistic given your <b>time, skills, resources and support</b>. Ask three questions before you commit: <i>Have I done something similar before? What would I still need to learn? Does my current schedule leave room for it?</i> If the honest answers are "no, a lot and no", the goal is not wrong, but it is too big for one step. Break it into <b>milestones</b>, each one a SMART goal of its own.</p>
<div class="kwt-wrap"><table class="kwt"><tr><th>Letter</th><th>Without it</th><th>How it protects motivation</th></tr>
<tr><td><b>S</b>pecific</td><td>"Get better at coding" leaves you unsure what to do today, so you put it off.</td><td>A clear target removes doubt and makes the first step obvious.</td></tr>
<tr><td><b>M</b>easurable</td><td>You cannot tell whether you are improving.</td><td>Numbers give you feedback, and seeing progress keeps you going.</td></tr>
<tr><td><b>A</b>chievable</td><td>Too easy bores you; too hard discourages you.</td><td>A realistic stretch builds confidence and keeps effort steady.</td></tr>
<tr><td><b>R</b>elevant</td><td>You chase a goal because others expect it.</td><td>A goal tied to your own aims gives you a reason to continue when it gets hard.</td></tr>
<tr><td><b>T</b>ime-bound</td><td>"Someday" never arrives.</td><td>A deadline creates healthy urgency and a point to review.</td></tr></table></div>
<h3 class="sec">From vague wish to SMART goal</h3>
<p><b>Vague:</b> "I want to become a data scientist." This is a direction, not a goal: nothing to do this week, nothing to measure, no deadline. <b>Too big:</b> "I will master machine learning by next month" fails the <b>achievable</b> test, and a missed deadline feels like personal failure. <b>SMART:</b> "I will complete the first four modules of an introductory machine-learning course and build one small project on a public dataset by 31 January, studying five hours a week." It is <b>specific</b> (course and project), <b>measurable</b> (four modules, one project), <b>achievable</b> (five hours a week for the time available), <b>relevant</b> (it moves you toward data science) and <b>time-bound</b> (31 January). Better still, the finished milestone becomes a small win and the base for the next goal.</p>
<h3 class="sec">Common mistakes</h3>
<p>Setting <b>too many goals at once</b>, which splits your effort until none of them moves. Copying someone else's goal, so <b>relevance</b> is missing. Treating the goal as fixed, even when your exams, health or circumstances change: <b>review it</b> and adjust the plan, not your self-worth. And ignoring setbacks. A missed week is data, not a verdict, which is exactly why the feedback loop and the Super Mario Effect later in this unit matter.</p>
<div class="say">Say it like this: "I chose a goal I can reach with effort, because a goal I believe in keeps me going, while an impossible one only teaches me to quit."</div>
<div class="why"><b class="t">Try it now</b>Take one vague goal of your own and rewrite it using all five letters. Then ask: <b>"Would I feel confident starting this tomorrow?"</b> If not, shrink it into a milestone until the answer is yes.</div>
<h2>OKRs (Objectives and Key Results)</h2>
<p>An <b>Objective</b> is a qualitative, inspiring goal. <b>Key Results</b> are 2 to 5 <b>measurable</b> outcomes that show it was reached.</p>
<figure class="dg"><svg viewBox="0 0 700 190" xmlns="http://www.w3.org/2000/svg" font-family="Roboto,Arial,sans-serif" role="img" aria-label="OKR structure"><rect x="200" y="4" width="300" height="52" fill="#F2F2F2" stroke="#111" stroke-width="2"/><text x="350" y="26" text-anchor="middle" font-size="14" font-weight="700">OBJECTIVE</text><text x="350" y="44" text-anchor="middle" font-size="11.5" fill="#444">Become a confident interviewer</text><path d="M350 56V84M110 84H590M110 84V108M350 84V108M590 84V108" fill="none" stroke="#111" stroke-width="2"/><g stroke="#111" stroke-width="2" fill="#fff"><rect x="10" y="108" width="200" height="70"/><rect x="250" y="108" width="200" height="70"/><rect x="490" y="108" width="200" height="70"/></g><g font-size="12" text-anchor="middle"><text x="110" y="132" font-weight="700">KEY RESULT 1</text><text x="110" y="152" fill="#444">Complete 6 mock</text><text x="110" y="166" fill="#444">interviews</text><text x="350" y="132" font-weight="700">KEY RESULT 2</text><text x="350" y="152" fill="#444">Score 4/5 on peer</text><text x="350" y="166" fill="#444">feedback</text><text x="590" y="132" font-weight="700">KEY RESULT 3</text><text x="590" y="152" fill="#444">Write 5 STAR</text><text x="590" y="166" fill="#444">stories</text></g></svg><figcaption><b>Draw it yourself:</b> one box on top, a horizontal bar beneath it, three boxes hanging below. Label the top box Objective and the lower ones Key Results.</figcaption></figure>
<div class="kwt-wrap"><table class="kwt"><tr><th>Framework</th><th>Key words to use in your response</th></tr>
<tr><td>SMART</td><td>one <b>specific</b> goal checked against <b>five criteria</b></td></tr>
<tr><td>OKR</td><td><b>ambitious objective</b> plus <b>measurable key results</b>, reviewed regularly</td></tr></table></div>
<h2>Personal branding: a practical guide <span class="tag-new">NEW</span></h2>
<p>Your <b>personal brand</b> is what people say and think about you when you are not in the room. You already have one: if a recruiter, professor or client types your name into a search engine, whatever appears <b>is</b> your brand. Personal branding means <b>shaping that impression on purpose</b> so that it is accurate, consistent and useful to your career. It is not about boasting or being famous. It is about making your skills, values and work <b>easy to find and easy to trust</b>.</p>
<h3 class="sec">The three questions and six key elements</h3>
<p>Every strong brand answers three questions: <b>Who am I professionally? What value can I offer? What do I want to be known for?</b> It is built from six elements, and a weakness in any one of them is visible to a reader.</p>
<div class="kwt-wrap"><table class="kwt"><tr><th>Element</th><th>What it means</th></tr>
<tr><td>Professional identity</td><td>Your skills, qualifications, interests and career goals, stated clearly</td></tr>
<tr><td>Consistency</td><td>The same message on every professional platform</td></tr>
<tr><td>Credibility</td><td>Proof through projects, achievements and contributions</td></tr>
<tr><td>Visibility</td><td>Your expertise can be found by employers and peers</td></tr>
<tr><td>Authenticity</td><td>Genuine strengths, not an artificial image</td></tr>
<tr><td>Professional communication</td><td>Appropriate language, visuals and tone</td></tr></table></div>
<h3 class="sec">Why it matters</h3>
<p>Employers, admissions committees and clients commonly look candidates up online before meeting them. A strong brand lets <b>opportunities find you</b> (recruiter messages, project invitations, mentors), makes you memorable among hundreds of similar resumes, and gives your resume claims <b>proof</b>. A weak or careless one, such as an unprofessional post or an empty profile, can quietly cost you chances you never learn about.</p>
<h3 class="sec">Step 1: Define your brand</h3>
<p>Before building anything, decide what you want to be known for. Answer three questions: <b>What are my strengths and values? Who do I want to reach (employers, universities, clients)? What do I want them to remember?</b> Then write a one-sentence <b>positioning statement</b>:</p>
<div class="say">"I am a Biomedical Engineering student who builds low-cost diagnostic devices and explains them in plain language." or "I am an IT student who builds clean, well-tested web apps for real campus problems."</div>
<h3 class="sec">Step 2: Audit your online presence</h3>
<ul><li><b>Search yourself</b> in a private or incognito window using your name plus your college or city. Note what appears on the first page.</li><li><b>Clean up:</b> delete or hide posts, photos and comments you would not want an employer to read. Use the <b>Grandma Test</b> from earlier: do not post what your grandmother would not approve of.</li><li><b>Check privacy settings</b> on each platform, and decide which accounts are personal and which are professional.</li><li>Use a <b>professional email address</b> (name-based) and, where possible, the <b>same name, photo and handle</b> across platforms, so people can recognise you.</li></ul>
<h3 class="sec">Step 3: Build a personal website or portfolio</h3>
<p>A personal website is the <b>one place you fully control</b>. Social platforms change their rules and layouts, but your site is yours. It is often the top result for your name, and it lets you <b>show</b> your work instead of only <b>listing</b> it. You do not need advanced skills: free tools such as <b>GitHub Pages, Google Sites, Notion or Wix</b> are enough, and a custom domain such as <b>yourname.com</b> adds polish.</p>
<div class="kwt-wrap"><table class="kwt"><tr><th>Page</th><th>What to include</th></tr>
<tr><td>Home</td><td>Your name, a one-line positioning statement, a clear photo and links to the other pages</td></tr>
<tr><td>About</td><td>A short story in your own voice: what you study, what drives you, what you want next</td></tr>
<tr><td>Projects / Portfolio</td><td>3 to 5 best projects, each with the problem, your role, tools used, the result and a link or demo (code for IT, device photos and reports for biomedical)</td></tr>
<tr><td>Resume</td><td>A downloadable PDF of your current resume</td></tr>
<tr><td>Publications</td><td>Research papers, reports or articles, each with a link (useful for higher studies and research roles)</td></tr>
<tr><td>Blog</td><td>Short posts that show how you think, such as lessons from a project</td></tr>
<tr><td>Contact</td><td>Email and LinkedIn; avoid putting your home address or full phone number publicly</td></tr></table></div>
<h3 class="sec">Step 4: Optimise your LinkedIn profile</h3>
<p>LinkedIn is the <b>professional search engine</b> that recruiters use daily, so treat it as your public resume with more detail and personality.</p>
<div class="kwt-wrap"><table class="kwt"><tr><th>Section</th><th>What to do</th><th>Example</th></tr>
<tr><td>Photo and banner</td><td>Clear, friendly, well-lit head-and-shoulders photo; a simple banner</td><td>Plain background, smiling, professional dress</td></tr>
<tr><td>Headline</td><td>Go beyond "Student at XYZ"; add your <b>skills and goal</b> as keywords</td><td>"Biomedical Engineering student | ECG signal processing | Medical device maintenance"</td></tr>
<tr><td>About</td><td>3 to 5 short sentences in first person: who you are, what you do well, what you are looking for</td><td>Start with a hook, end with how to contact you</td></tr>
<tr><td>Experience and projects</td><td>Use resume-style bullets with numbers; attach links, images or reports</td><td>"Cut page load time by 30%..."</td></tr>
<tr><td>Skills and endorsements</td><td>List 10 to 15 relevant skills; ask peers to endorse the top ones</td><td>Python, React, MATLAB, calibration</td></tr>
<tr><td>Recommendations</td><td>Request 2 or 3 from professors, internship supervisors or team leads</td><td>Ask politely, and remind them of the specific work</td></tr>
<tr><td>Custom URL</td><td>Shorten it to your name and add it to your resume</td><td>linkedin.com/in/yourname</td></tr></table></div>
<p><b>Your About section should cover five things:</b> your current status (student, intern, graduate), your areas of expertise, your main skills, your career interests, and one or two relevant projects or achievements. Then test the whole profile with one question: <b>"What can this person contribute?"</b> A profile should answer that question, not simply list everything you have ever done.</p>
<h3 class="sec">Step 5: Share and engage (thought leadership)</h3>
<p><b>Thought leadership</b> means sharing <b>original insights</b> that show how you think. Start small: post a short lesson from your internship, write an article explaining your project, or comment thoughtfully on other people's posts. Posting once or twice a week for a few months builds credibility far more than one burst. Always <b>give credit</b>, check facts and keep the tone respectful. You do <b>not</b> need to be an established expert to begin; you only need to share something useful and honest.</p>
<ul><li><b>Ways to start:</b> write LinkedIn posts or short articles, share reflections on a project, post lessons from an internship, make a simple infographic or explainer video, discuss trends <b>with sources</b>, or present at a seminar.</li><li><b>Reflect, do not just report.</b> "Three lessons I learned while building a renewable-energy project" shows knowledge and reflection. "I completed a renewable-energy project" only announces a result.</li></ul>
<h3 class="sec">What else belongs in your brand?</h3>
<ul><li><b>Field-specific platforms:</b> GitHub (code), Kaggle (data), Behance or Dribbble (design), and for researchers Google Scholar, ORCID or ResearchGate.</li><li><b>Short writing or video:</b> a blog on Medium, a short intro video or a project walk-through.</li><li><b>Your offline brand:</b> how you dress, speak and show up. Prepare a 30-second <b>elevator pitch</b> (see <b>Crafting an Elevator Pitch</b> below) and carry a simple digital or printed contact card.</li><li><b>Consistency and authenticity:</b> the same story, tone and visuals everywhere, and nothing that is not true. A brand that exaggerates collapses at the interview.</li><li><b>Maintenance:</b> review everything <b>every three to six months</b> and update after each new project, certificate or internship.</li></ul>
<h3 class="sec">Keep it consistent across platforms</h3>
<p>Recruiters move from one platform to the next: <b>LinkedIn, then your website, portfolio, professional email and publications</b>. If the story changes at each step, trust drops. Keep these the same everywhere: <b>name, photo, areas of expertise, career interests, writing style and key achievements</b>. For example, if LinkedIn says you are an AI and data analytics enthusiast, your website and portfolio must <b>prove it</b> with relevant projects, articles or certifications.</p>
<h3 class="sec">Common mistakes to avoid</h3>
<ul><li>No clear professional focus, or a generic summary copied from someone else.</li><li>Unprofessional photographs, usernames or email addresses.</li><li>Listing skills without showing them in a project.</li><li>Excessively personal content on professional platforms.</li><li>Exaggerated claims, unchecked facts, or details that differ between platforms.</li><li>Listing achievements without the <b>learning or impact</b> behind them.</li><li>Treating branding as <b>self-promotion</b> instead of <b>value creation</b>. Ask what the reader gains, not how impressive you look.</li></ul>
<h3 class="sec">Ethics in personal branding</h3>
<p>A brand must be authentic <b>and</b> ethical. Never falsify achievements or claim expertise you lack. Credit your collaborators, respect copyright, and verify information before sharing it. <b>Protect confidential information</b>: do not post patient data, an employer's code or an internship's internal documents. Keep your online behaviour professional, because one breach of trust can undo years of careful building.</p>
<h3 class="sec">A cycle for building your brand</h3>
${fig(chain(['1','2','3','4','5','6'],['Discover','Define','Develop','Demonstrate','Distribute','Maintain'],['Find your|strengths|and values','Decide how|you want to|be known','Build skills|and|experience','Show projects|and proof','Share on|LinkedIn, web','Review and|update'],'Brand-building cycle'),'A brand is not a perfect image. It is a <b>credible, consistent identity backed by evidence</b>, and it keeps changing as you grow.','six rectangles in a row with arrows, numbers 1 to 6 inside, and one verb under each.')}
<div class="note new"><strong class="t">Brand audit checklist</strong><ul><li>My name search shows professional results on page one.</li><li>My LinkedIn headline contains my skills, not only my college.</li><li>My website or portfolio shows at least 3 projects with results.</li><li>My photo, name and bio match across platforms.</li><li>I have posted something useful in the last month.</li></ul></div>
<h2>Crafting an Elevator Pitch <span class="tag-new">NEW</span></h2>
<p>An <b>elevator pitch</b> is a short, clear introduction of who you are and what you offer, short enough to deliver during a lift ride: about <b>30 to 60 seconds, or 75 to 150 words</b>. It is your positioning statement from the personal branding module, <b>spoken aloud</b>.</p>
<h3 class="sec">Why it matters</h3>
<p>You rarely get a long time to make an impression. At a career fair, a seminar, a networking event or the start of an interview ("Tell me about yourself"), you may have <b>one minute</b>. A prepared pitch means you do not ramble or freeze, people remember you, and the other person knows <b>how to help you</b>. It also turns a chance meeting into a follow-up conversation.</p>
<h3 class="sec">The format: Hook, Who, Value, Ask</h3>
${fig(chain(['1','2','3','4'],['Hook','Who you are','Value and proof','Ask'],['Grab attention|in one line','Your field|and focus','What you do|plus one result','A clear|next step'],'Elevator pitch structure'),'Spend most of your time on <b>Value and proof</b>. End with an <b>Ask</b> so the conversation continues.','four rectangles in a row with arrows, numbers 1 to 4 inside, and the part names under them.')}
<div class="kwt-wrap"><table class="kwt"><tr><th>Part</th><th>Job</th><th>Example</th></tr>
<tr><td>Hook</td><td>Opens with a problem, question or interesting fact</td><td>"Did you know many ECG recordings are discarded because of noise?"</td></tr>
<tr><td>Who you are</td><td>Name, field, stage of study</td><td>"I am Shruthi, a final-year Biomedical Engineering student."</td></tr>
<tr><td>Value and proof</td><td>What you do for others, backed by one specific result</td><td>"I built a Python filter that cut preprocessing time from 2 hours to 15 minutes."</td></tr>
<tr><td>Ask</td><td>States what you want next, politely</td><td>"I would love to learn how your team handles signal data. Could we speak for ten minutes?"</td></tr></table></div>
<div class="say">Full pitch (about 40 seconds): "Did you know that many ECG recordings are thrown away because of noise? I am Shruthi, a final-year Biomedical Engineering student. I built a Python filter that cut our preprocessing time from two hours to fifteen minutes, and I enjoy making medical data usable. I am looking for an internship in device software, so I would love to hear how your team handles signal data."</div>
<h3 class="sec">How to write yours, step by step</h3>
<ol><li><b>Start from your positioning statement</b> and your target listener (recruiter, professor, alumnus).</li><li><b>Pick one proof point</b>, ideally with a number. One strong example beats five weak ones.</li><li><b>Write it as speech</b>, in short sentences, with no jargon the listener would not know.</li><li><b>Trim to about 100 words</b>, then read it aloud and time it.</li><li><b>Make three versions:</b> a 15-second one-liner, a 60-second pitch and a written one for your LinkedIn About section.</li><li><b>Adapt to the audience:</b> lead with technical depth for an engineer and with teamwork and reliability for an HR manager.</li></ol>
<h3 class="sec">Confident, not cocky</h3>
<p>Confidence says "here is what I can do, and here is the proof". Cockiness says "I am better than everyone". The difference is <b>evidence, tone and curiosity</b>. Let facts do the boasting.</p>
<div class="kwt-wrap"><table class="kwt"><tr><th></th><th>Confident</th><th>Cocky</th></tr>
<tr><td>Claims</td><td>"I improved accuracy to 92% on our test data."</td><td>"I am the best programmer in my class."</td></tr>
<tr><td>Teamwork</td><td>"I led the testing; my team handled the design."</td><td>"I did everything; the team slowed me down."</td></tr>
<tr><td>Listening</td><td>Pauses and asks the listener a question</td><td>Talks without stopping and ignores reactions</td></tr>
<tr><td>Weak spots</td><td>"I am still learning cloud tools."</td><td>Pretends to know everything</td></tr>
<tr><td>Body language</td><td>Eye contact, a steady pace and a genuine smile</td><td>Smirking, interrupting, or looking over their shoulder</td></tr></table></div>
<p>Confidence comes from <b>practice</b>, not from volume. Rehearse aloud until the words feel natural, but do not memorise them so rigidly that you sound like a recording. If you lose your place, pause, breathe and continue with the next part.</p>
<p><b>Common mistakes:</b> reciting a memorised speech, using the same pitch for every listener, running past two minutes, listing duties instead of results, and forgetting the Ask.</p>
<div class="why"><b class="t">Try it now</b>Write a 100-word pitch using the four parts, then record yourself on your phone. Play it back and check three things: <b>Did I give proof? Did I sound natural? Did I end with an ask?</b></div>
<details class="qc"><summary>Quick check: which part of the pitch makes the conversation continue?</summary><p>The <b>Ask</b>. It gives the listener a clear next step, such as a short chat or a referral.</p></details>
<h2>Resilience, Adaptability and Continuous Feedback <span class="tag-new">NEW</span></h2>
<p>Careers rarely follow a straight line. Goals will be missed, interviews will go badly, and industries (especially technology and healthcare) change quickly. The people who thrive are not those who never fail; they are those who <b>recover, adjust and keep improving</b>. This module brings together three connected skills.</p>
<div class="kwt-wrap"><table class="kwt"><tr><th>Skill</th><th>Meaning</th><th>In practice</th></tr>
<tr><td>Resilience</td><td>Bouncing back from setbacks</td><td>Staying calm after a rejection and trying again</td></tr>
<tr><td>Adaptability</td><td>Changing your approach when conditions change</td><td>Learning a new tool or shifting to a new field</td></tr>
<tr><td>Continuous feedback</td><td>Regularly checking results and learning from others</td><td>Acting, measuring, adjusting, and repeating</td></tr></table></div>
<h3 class="sec">Growth mindset</h3>
<p>Psychologist <b>Carol Dweck</b> distinguishes a <b>fixed mindset</b> ("I am either good at this or not") from a <b>growth mindset</b> ("I can develop this through effort and good strategy"). With a growth mindset, a failed test or rejected application becomes <b>information</b>, not a verdict. A simple habit is to add one word: "I cannot do this <b>yet</b>."</p>
<h3 class="sec">The feedback loop: Act, Measure Feedback, Adjust</h3>
<p>Goals improve when you treat them as <b>experiments</b> rather than one-time promises. The loop has three steps that you repeat.</p>
${fig(chain(['A','M','A'],['Act','Measure & Feedback','Adjust'],['Try the plan|in the real world','Check numbers and|ask for feedback','Change one thing,|then repeat'],'Act, Measure and Get Feedback, Adjust loop'),'Run the loop <b>weekly</b> for small habits and <b>quarterly</b> for OKRs. Each lap should end with one concrete change.','three rectangles in a row with arrows, then a curved arrow from the last box back to the first. Write Act, Measure and Get Feedback, Adjust.')}
<ol><li><b>Act:</b> take a real step towards the goal, even if the plan is not perfect. Action creates information that thinking alone cannot.</li><li><b>Measure and get feedback:</b> check your results against your SMART goal or key result, and ask <b>specific</b> people for feedback (a mentor, a peer, an interviewer). Ask "What is one thing I could do better?" instead of "How was I?"</li><li><b>Adjust:</b> choose <b>one change</b> based on what you learned, then act again. Changing everything at once makes it impossible to know what worked.</li></ol>
<div class="say">Example: <b>Act</b> - do one mock interview every week. <b>Measure and feedback</b> - score each answer on a 5-point rubric and ask your peer for one improvement. <b>Adjust</b> - this week, shorten the Situation part of your STAR stories. Next week, repeat.</div>
<p>Review <b>OKRs weekly or quarterly</b>, not once a year. When receiving feedback, <b>listen without defending</b>, ask a follow-up question, say thank you, and decide later what to use. Not all feedback needs to be accepted, but all of it should be considered.</p>
<h3 class="sec">Career pivots</h3>
<p>Adaptability is most visible during a <b>career pivot</b>, such as moving from core biomedical work into health-tech software. List your <b>transferable skills</b> (data analysis, documentation, problem-solving, communication), <b>upskill</b> in the gaps with short courses, and <b>test the new field through small projects</b> before making a full jump.</p>

<div class="mario-text"><strong class="t">Level up: focus on the princess, not the pits</strong>
<p>In <b>Super Mario Bros.</b> you fall into pits again and again, yet nobody quits. You simply respawn and try again, because your eyes are on the <b>goal</b> (rescuing the princess), not on the number of times you failed. Former NASA engineer and YouTuber <b>Mark Rober</b> calls this the <b>Super Mario Effect</b>.</p>
<p>He tested it with a coding puzzle given to about <b>50,000 people</b>. One group <b>lost points for every failed attempt</b>, while the other was <b>not penalised</b>. The result was striking:</p>
<div class="mario-vs"><div class="pit"><b class="big">52%</b>solved the puzzle when failures were penalised</div><div class="pri"><b class="big">68%</b>solved it when failures were not penalised, and they also tried about <b>2.5 times</b> more often</div></div>
<p><b>Lesson for your career:</b> do not count the pits. A rejected application, a failed interview or a bug in your code is not a score against you; it is a respawn point. Use the loop above: <b>Act</b> (take the jump), <b>Measure and get Feedback</b> (see where you fell), <b>Adjust</b> (change the jump) and go again, always keeping the <b>goal</b> in view.</p>
</div></div>
<p>This does not mean ignoring mistakes. It means <b>changing how you relate to them</b>: failure is the cost of learning, so the more attempts you make, the faster you improve. In a job search, that could mean treating your first five interviews as practice levels rather than final exams.</p>
<p><b>Watch the talk:</b> Mark Rober, <i>The Super Mario Effect: Tricking Your Brain into Learning More</i> (TEDxPenn). It is about 15 minutes long.</p>
<p><a class="mario-link" href="https://www.youtube.com/watch?v=9vJRopau0g0" target="_blank" rel="noopener noreferrer">&#9654; Watch Mark Rober's TED talk</a> &nbsp; <a href="https://www.ted.com/talks/mark_rober_the_super_mario_effect_tricking_your_brain_into_learning_more" target="_blank" rel="noopener noreferrer">View on TED.com</a></p>
<h2>Mentorship and networking <span class="tag-new">NEW</span></h2>
<ul><li><b>Mentor</b>: an experienced guide for advice and leadership development. <b>Sponsor</b>: someone who advocates for you.</li><li><b>Strategic networking</b>: build <b>genuine, reciprocal</b> relationships; use <b>alumni connections</b>; prepare an <b>elevator pitch</b>; follow up within 48 hours.</li><li>Lab ideas: build a <b>career portfolio</b> and plan a <b>mentorship programme</b>.</li></ul>
<h3 class="sec">Why a recommendation opens doors</h3>
<p>Most people believe jobs go to the best CV. In practice, hiring is also a <b>trust problem</b>: a recruiter cannot see how you work, so a <b>trusted person's word</b> fills the gap. The numbers show it. Industry hiring reports (Jobvite, SilkRoad, summarised by SHRM) find that referred candidates make up only about <b>7% of applicants</b> but roughly <b>30 to 45% of hires</b>. Lever's analysis of over four million candidates found that about <b>1 in 16 referred candidates was hired, against 1 in 152</b> who applied through a company careers page. Referred candidates are also more likely to accept an offer and to stay longer. Remember that these figures come mostly from US and global recruiting data, so treat them as a strong pattern rather than an exact Indian number.</p>
<p>The reason is simple. A referral lets the employer <b>borrow someone else's reputation</b> and cuts the risk of a bad hire. This is the <b>ethos</b> you studied in Unit 3, passed on by a third party. It also explains why a recommendation only works when the referrer <b>actually knows your work</b>: a name dropped by someone who has never seen you perform carries almost no weight.</p>
<div class="say">You do not need to "know people in high places". You need a few people who have <b>seen you do good work</b> and are willing to say so.</div>
<h3 class="sec">Your first network: the faculty around you</h3>
<p>For most students, the people best placed to vouch for you are already in the building. Gallup's large study of US graduates (the Gallup-Purdue Index) found that those who had a <b>professor who cared about them, a professor who made them excited to learn, and a mentor who encouraged their goals</b> were about <b>twice as likely to be engaged in their work</b> later in life. Yet only about <b>22%</b> strongly agreed that they had such a mentor. Most graduates leave college without the very relationship that predicts a good start, which is a chance for the student who builds one deliberately.</p>
<p>Faculty bonds also work as a <b>recommendation pipeline</b>. A professor who has supervised your project or watched you improve across a semester can write a specific reference letter for an internship, a job or an SOP, and many also know industry contacts, research labs and alumni who are hiring. Generic letters ("a hardworking student") are easy to ignore; letters with <b>examples</b> are not.</p>
<p>Building the bond takes effort but not charm. <b>Attend office hours</b> with a real question, not just for marks. <b>Ask about their research</b> and offer to help with a small task or a mini-project. <b>Follow up</b> with a short thank-you or an update ("I tried the method you suggested; here is the result"). <b>Ask for a reference early</b>, at least two to three weeks ahead, and share your resume and the role so the letter can be specific. Do the same with seniors, alumni and internship supervisors, and always give something back, such as a thank-you note, an update on how their advice worked, or an introduction to someone useful to them.</p>
<details class="qc"><summary>Quick check: what makes "get fit" a weak goal under SMART?</summary><p>It is not <b>specific</b>, <b>measurable</b> or <b>time-bound</b>. "Run 5 km in under 30 minutes by June" fixes all three.</p></details>`}

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function shuffleMCQOptions(q){
  const tagged = q.options.map((opt, i) => ({ opt, isCorrect: i === q.correct }));
  const shuffled = shuffle(tagged);
  return { type:'mcq', text:q.text, options: shuffled.map(o => o.opt), correct: shuffled.findIndex(o => o.isCorrect) };
}

function buildFRQQuestions(mod){
  return shuffle(MODULES[mod].frq);
}

function buildMCQQuestions(mod){
  return shuffle(MODULES[mod].mcq.map(shuffleMCQOptions));
}

function normalize(s){
  // text inside (...) neither counts for nor against the answer
  return s.replace(/\([^)]*\)?/g,' ').toLowerCase().trim().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
}

function levenshtein(a, b){
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const dp = Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for (let j=0;j<=n;j++) dp[0][j]=j;
  for (let i=1;i<=m;i++){
    for (let j=1;j<=n;j++){
      const cost = a[i-1]===b[j-1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+cost);
    }
  }
  return dp[m][n];
}

function isFuzzyMatch(userText, expected){
  const a = normalize(userText), b = normalize(expected);
  if (!a) return false;
  if (a === b) return true;
  const threshold = Math.max(1, Math.floor(b.length * 0.25));
  return levenshtein(a, b) <= threshold;
}

  bubbles.forEach((b, idx) => {
    b.classList.remove('active','answered');
    if (idx === activeIdx) b.classList.add('active');
    if (state[idx].checked) b.classList.add('answered');
  });
}

function updateTotals(){
  const scored = state.reduce((sum, s) => sum + s.score, 0);
  const max = questions.reduce((sum, q) => sum + q.maxMarks, 0);
  DOM.totalScore.innerText = scored;
  DOM.totalMax.innerText = max;
}

function renderMCQOptions(){
  const q = questions[activeIdx];
  const s = state[activeIdx];
  const letters = ['A','B','C','D','E','F'];

  DOM.mcqOptions.innerHTML = '';
  q.options.forEach((opt, idx) => {
    const row = document.createElement('div');
    row.className = 'mcq-option';
    if (s.selected === idx) row.classList.add('selected');
    if (s.checked){
      row.classList.add('disabled');
      if (idx === q.correct) row.classList.add('correct');
      else if (idx === s.selected) row.classList.add('incorrect');
    } else {
      row.addEventListener('click', () => { s.selected = idx; renderMCQOptions(); });
    }
    row.innerHTML = '<span class="opt-letter">' + letters[idx] + '</span><span>' + opt + '</span>';
    DOM.mcqOptions.appendChild(row);
  });

  if (s.checked){
    const correct = s.selected === q.correct;
    DOM.mcqFeedback.style.display = 'block';
    DOM.mcqFeedback.className = 'mcq-feedback ' + (correct ? 'hit' : 'miss');
    DOM.mcqFeedback.innerText = (correct ? 'Correct! ' : 'Incorrect — correct answer: ' + q.options[q.correct] + '. ') + '(' + s.score + '/1)';
  } else {
    DOM.mcqFeedback.style.display = 'none';
  }
}

    DOM.resultBox.style.display = 'none';
    renderMCQOptions();
  } else {
    gridEl.style.display = 'none';
    DOM.frqInputArea.style.display = 'block';
    DOM.mcqOptions.style.display = 'none';
    DOM.mcqFeedback.style.display = 'none';
    DOM.checkBtn.innerText = 'Check Answer';
    DOM.answerBox.value = s.text;
    DOM.answerBox.placeholder = q.type === 'numeric' ? 'Type your numeric answer...' : 'Type each answer on its own line...';
    document.getElementById('qHint').innerText = q.type === 'numeric'
      ? 'Enter a single number as your answer.'
      : 'Type one answer per line, in any order. Then check your answers.';

    if (s.checked){
      showResults(false);
    } else {
      DOM.resultBox.style.display = 'none';
    }
  }

  DOM.prevBtn.disabled = (activeIdx === 0);
  DOM.nextBtn.disabled = (activeIdx === questions.length - 1);

  updateNav();
  updateTotals();
}

function checkMCQAnswer(){
  const q = questions[activeIdx];
  const s = state[activeIdx];
  if (s.selected === undefined || s.selected === null) return;
  s.checked = true;
  s.score = (s.selected === q.correct) ? 1 : 0;
  renderMCQOptions();
  updateNav();
  updateTotals();
}

/* ---------- Grid (table) question: Belbin Team Roles ---------- */
function gridCell(){ return 'cells'; }
function renderGrid(q, s){
  if (!s.cells) s.cells = new Array(12).fill('');
  const el = document.getElementById('gridArea');
  let h = '<div class="grid-hint">Type one entry in each box. Roles under a heading can be in any order. Then check your answers.</div><div class="grid-wrap"><table class="gridq" role="grid" aria-label="Belbin team roles table">';
  for (let r = 0; r < 4; r++){
    h += '<tr' + (r === 0 ? ' class="hd"' : '') + '>';
    for (let c = 0; c < 3; c++){
      const i = r * 3 + c;
      const ph = r === 0 ? 'Group heading' : 'Role ' + r;
      const cls = s.checked ? (s.matches && s.matches[i] ? 'ok' : 'bad') : '';
      h += '<td><input type="text" data-i="' + i + '" placeholder="' + ph + '" aria-label="' + (r === 0 ? 'Heading ' + (c+1) : 'Row ' + r + ', column ' + (c+1)) + '" autocomplete="off" autocapitalize="words" spellcheck="false" class="' + cls + '"' + (s.checked ? ' disabled' : '') + '></td>';
    }
    h += '</tr>';
  }
  h += '</table></div>';
  el.innerHTML = h;
  const inputs = el.querySelectorAll('input');
  inputs.forEach((inp, i) => {
    inp.value = s.cells[i] || '';
    inp.addEventListener('input', () => { s.cells[i] = inp.value; });
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter'){ e.preventDefault(); const n = inputs[i + 1]; if (n) n.focus(); else checkAnswer(); }
    });
  });
}

function stripHeading(t){
  return normalize(t).replace(/\b(oriented|roles?|team|group)\b/g,'').replace(/\s+/g,' ').trim();
}

function gradeGrid(q, s){
  const ok = new Array(12).fill(false);
  q.cols.forEach((col, c) => {
    const head = stripHeading(s.cells[c] || '');
    const hb = normalize(col.h);
    if (head && levenshtein(head, hb) <= Math.max(1, Math.floor(hb.length * 0.25))) ok[c] = true;
    const pairs = [];
    for (let r = 1; r <= 3; r++){
      const u = normalize(s.cells[r * 3 + c] || '');
      if (!u) continue;
      col.roles.forEach((role, ri) => {
        const b = normalize(role);
        const d = levenshtein(u, b);
        if (d <= Math.max(1, Math.floor(b.length * 0.25))) pairs.push({ cell: r * 3 + c, ri, d });
      });
    }
    pairs.sort((x, y) => x.d - y.d);
    const usedCell = {}, usedRole = {};
    pairs.forEach(p => {
      if (!usedCell[p.cell] && !usedRole[p.ri]){ usedCell[p.cell] = true; usedRole[p.ri] = true; ok[p.cell] = true; }
    });
  });
  return ok;
}

function showGridResults(q, s){
  DOM.resultBox.style.display = 'flex';
  DOM.scoreNum.innerText = s.score + ' / ' + q.answers.length;
  DOM.resultRows.innerHTML = '';
  q.cols.forEach((col, c) => {
    const full = s.matches[c] && [1,2,3].every(r => s.matches[r * 3 + c]);
    const row = document.createElement('div');
    row.className = 'result-row';
    row.innerHTML = '<div class="result-icon ' + (full ? 'hit' : 'miss') + '">' + (full ? '\u2713' : '\u2715') + '</div>' +
      '<div class="result-text"><div class="expected">' + col.h.toUpperCase() + '</div><div class="matched">' + col.roles.join(' \u00b7 ') + '</div></div>';
    DOM.resultRows.appendChild(row);
  });
}

function checkGrid(){
  const q = questions[activeIdx], s = state[activeIdx];
  if (!s.cells) s.cells = new Array(12).fill('');
  s.matches = gradeGrid(q, s);
  s.score = s.matches.filter(Boolean).length;
  s.checked = true;
  render();
}

function checkAnswer(){
  const q = questions[activeIdx];
  if (q.type === 'mcq'){ checkMCQAnswer(); return; }
  if (q.type === 'grid'){ checkGrid(); return; }

  const s = state[activeIdx];
  s.text = DOM.answerBox.value;

  if (q.type === 'numeric'){
    const raw = s.text.trim();
    const userNum = parseInt(raw.replace(/[^\d-]/g, ''), 10);
    const expectedNum = parseInt(q.answers[0], 10);
    const correct = raw.length > 0 && !isNaN(userNum) && userNum === expectedNum;
    s.score = correct ? 1 : 0;
    s.checked = true;
    s.matches = [correct ? raw : null];
    showResults(true);
    updateNav();
    updateTotals();
    return;
  }

  const lines = s.text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  const usedLine = new Array(lines.length).fill(false);
  const matches = q.answers.map(() => null);

  const pairs = [];
  q.answers.forEach((expected, qi) => {
    const b = normalize(expected);
    const threshold = Math.max(1, Math.floor(b.length * 0.25));
    lines.forEach((line, li) => {
      const dist = levenshtein(normalize(line), b);
      if (dist <= threshold) pairs.push({ qi, li, dist });
    });
  });
  pairs.sort((x, y) => x.dist - y.dist);
  pairs.forEach(p => {
    if (matches[p.qi] === null && !usedLine[p.li]){
      matches[p.qi] = lines[p.li];
      usedLine[p.li] = true;
    }
  });

  s.score = matches.filter(m => m !== null).length;
  s.checked = true;
  s.matches = matches;

  showResults(true);
  updateNav();
  updateTotals();
}

function showResults(){
  const q = questions[activeIdx];
  const s = state[activeIdx];

  DOM.resultBox.style.display = 'flex';
  DOM.scoreNum.innerText = s.score + ' / ' + q.answers.length;
  DOM.resultRows.innerHTML = '';

  q.answers.forEach((expected, i) => {
    const matched = s.matches ? s.matches[i] : null;
    const row = document.createElement('div');
    row.className = 'result-row';
    const icon = document.createElement('div');
    icon.className = 'result-icon ' + (matched ? 'hit' : 'miss');
    icon.innerText = matched ? '✓' : '✕';
    const text = document.createElement('div');
    text.className = 'result-text';
    text.innerHTML = '<div class="expected">' + expected + '</div>' +
      (matched ? '<div class="matched">You wrote: "' + matched + '"</div>' : '<div class="matched">Not found in your answers</div>');
    row.appendChild(icon);
    row.appendChild(text);
    DOM.resultRows.appendChild(row);
  });
}

DOM.checkBtn.addEventListener('click', checkAnswer);
DOM.clearBtn.addEventListener('click', () => {
  const s = state[activeIdx];
  s.text = ''; s.checked = false; s.score = 0; s.matches = null; s.selected = undefined; s.cells = null;
  render();
});

DOM.prevBtn.addEventListener('click', () => { if (activeIdx > 0){ captureText(); activeIdx--; saveSession(); render(); } });
DOM.nextBtn.addEventListener('click', () => { if (activeIdx < questions.length - 1){ captureText(); activeIdx++; saveSession(); render(); } });
